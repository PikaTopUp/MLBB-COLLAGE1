<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MLBB Collage Maker Pro</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- html-to-image CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .selected-tile { ring: 2px solid #a855f7; border-color: #a855f7 !important; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#090d16] text-slate-200 min-h-screen flex flex-col font-sans select-none pb-28">

  <!-- TOP BAR -->
  <header class="p-3 border-b border-slate-800 bg-[#0d121f] flex items-center justify-between">
    <div class="flex items-center gap-2">
      <i class="fa-solid fa-crown text-purple-400"></i>
      <h1 class="font-extrabold text-white text-sm">MLBB <span class="text-purple-400">Collage Maker</span></h1>
    </div>
    <!-- NUDGE CONTROLS -->
    <div class="flex items-center gap-1 bg-[#131a29] p-1 rounded-lg border border-slate-800">
      <span class="text-[10px] text-slate-400 px-1">Move Tile:</span>
      <button onclick="moveSelectedSkin('up')" class="w-6 h-6 bg-slate-800 hover:bg-slate-700 rounded text-xs text-white"><i class="fa-solid fa-arrow-up"></i></button>
      <button onclick="moveSelectedSkin('down')" class="w-6 h-6 bg-slate-800 hover:bg-slate-700 rounded text-xs text-white"><i class="fa-solid fa-arrow-down"></i></button>
      <button onclick="moveSelectedSkin('left')" class="w-6 h-6 bg-slate-800 hover:bg-slate-700 rounded text-xs text-white"><i class="fa-solid fa-arrow-left"></i></button>
      <button onclick="moveSelectedSkin('right')" class="w-6 h-6 bg-slate-800 hover:bg-slate-700 rounded text-xs text-white"><i class="fa-solid fa-arrow-right"></i></button>
    </div>
  </header>

  <!-- CANVAS DISPLAY -->
  <main class="flex-1 p-3 flex flex-col items-center justify-start overflow-x-auto">
    <div id="collage-canvas" class="w-full max-w-sm bg-[#0e1320] border border-slate-800 rounded-xl p-2 shadow-2xl flex flex-col gap-2 transition-all">
      
      <!-- Account Screenshot Header -->
      <div id="screenshot-container" class="w-full min-h-[140px] bg-[#141b2d] rounded-lg border border-slate-800 flex items-center justify-center relative overflow-hidden">
        <label class="w-full h-full flex flex-col items-center justify-center cursor-pointer p-4">
          <i class="fa-solid fa-cloud-arrow-up text-purple-400 text-xl mb-1"></i>
          <p id="screenshot-placeholder" class="text-[11px] text-slate-400 text-center font-medium">Upload Account Screenshot</p>
          <input type="file" id="screenshot-upload" accept="image/*" class="hidden">
        </label>
        <img id="screenshot-img" class="absolute inset-0 w-full h-full object-cover hidden" alt="Screenshot">
      </div>

      <!-- Selected Skins Grid -->
      <div id="skins-grid" class="grid gap-1 bg-[#090d16] p-1 rounded-lg border border-slate-800/60 min-h-[150px]">
        <!-- Dynamic Canvas Tiles -->
      </div>
    </div>
  </main>

  <!-- CONTROL DRAWER -->
  <div id="control-drawer" class="fixed bottom-14 inset-x-0 bg-[#0d121f] border-t border-slate-800 p-3 max-w-md mx-auto rounded-t-2xl shadow-2xl max-h-80 overflow-y-auto">
    
    <!-- TAB 1: SKINS SELECTOR -->
    <div id="tab-skins" class="space-y-2">
      <div class="flex justify-between items-center border-b border-slate-800 pb-1.5">
        <div class="flex items-center gap-2">
          <span class="text-xs font-bold text-white">Skin Library</span>
          <span id="selected-count-badge" class="bg-purple-900/50 text-purple-300 text-[10px] px-2 py-0.5 rounded-full border border-purple-500/30">Loading...</span>
        </div>
        <button id="clear-all-btn" class="text-[10px] text-red-400 hover:text-red-300">Clear All</button>
      </div>

      <input type="text" id="skin-search-input" placeholder="Search hero or skin name (e.g. Chou, Fanny, Legend)..." class="w-full bg-[#151b2a] border border-slate-700 rounded px-2.5 py-1 text-xs text-white focus:outline-none focus:border-purple-500">
      
      <div class="flex gap-1 overflow-x-auto no-scrollbar text-[9px] py-0.5">
        <button onclick="filterRarity('ALL')" class="bg-purple-600 text-white px-2 py-0.5 rounded font-bold">ALL</button>
        <button onclick="filterRarity('Legend')" class="bg-slate-800 text-amber-400 px-2 py-0.5 rounded font-bold">Legend</button>
        <button onclick="filterRarity('Collector')" class="bg-slate-800 text-cyan-400 px-2 py-0.5 rounded font-bold">Collector</button>
        <button onclick="filterRarity('KOF')" class="bg-slate-800 text-red-400 px-2 py-0.5 rounded font-bold">KOF</button>
        <button onclick="filterRarity('Aspirants')" class="bg-slate-800 text-pink-400 px-2 py-0.5 rounded font-bold">Aspirants</button>
        <button onclick="filterRarity('STUN')" class="bg-slate-800 text-yellow-400 px-2 py-0.5 rounded font-bold">STUN</button>
      </div>

      <div id="picker-grid" class="grid grid-cols-5 gap-1.5 mt-1">
        <!-- Rendered via JS -->
      </div>
    </div>

    <!-- TAB 2: LAYOUT -->
    <div id="tab-layout" class="hidden space-y-3">
      <h3 class="text-xs font-bold text-white border-b border-slate-800 pb-1.5">Grid Layout</h3>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-[10px] text-slate-400 block mb-1">Columns</label>
          <input type="number" id="cols-input" value="4" min="1" max="10" class="w-full bg-[#151b2a] border border-slate-700 rounded p-1.5 text-xs text-center font-bold text-white">
        </div>
        <div>
          <label class="text-[10px] text-slate-400 block mb-1">Rows</label>
          <input type="number" id="rows-input" value="4" min="1" max="20" class="w-full bg-[#151b2a] border border-slate-700 rounded p-1.5 text-xs text-center font-bold text-white">
        </div>
      </div>
    </div>

    <!-- TAB 3: EFFECTS -->
    <div id="tab-effects" class="hidden space-y-3">
      <div class="flex justify-between items-center border-b border-slate-800 pb-1.5">
        <h3 class="text-xs font-bold text-white">Visual Effects</h3>
        <button id="reset-effects-btn" class="text-[10px] text-purple-400 hover:text-purple-300">Reset Effects</button>
      </div>

      <div class="grid grid-cols-2 gap-2.5 text-[10px] text-slate-400">
        <div>
          <label class="block mb-1">Brightness</label>
          <input type="range" id="effect-brightness" min="50" max="150" value="100" class="w-full accent-purple-500">
        </div>
        <div>
          <label class="block mb-1">Saturation</label>
          <input type="range" id="effect-saturate" min="0" max="200" value="100" class="w-full accent-purple-500">
        </div>
        <div>
          <label class="block mb-1">Contrast</label>
          <input type="range" id="effect-contrast" min="50" max="150" value="100" class="w-full accent-purple-500">
        </div>
        <div>
          <label class="block mb-1">Hue Rotate</label>
          <input type="range" id="effect-hue" min="0" max="360" value="0" class="w-full accent-purple-500">
        </div>
        <div>
          <label class="block mb-1">Blur (px)</label>
          <input type="range" id="effect-blur" min="0" max="10" value="0" class="w-full accent-purple-500">
        </div>
        <div>
          <label class="block mb-1">Grayscale</label>
          <input type="range" id="effect-grayscale" min="0" max="100" value="0" class="w-full accent-purple-500">
        </div>
      </div>
    </div>

    <!-- TAB 4: EXPORT & QUALITY OPTIONS -->
    <div id="tab-export" class="hidden space-y-3">
      <h3 class="text-xs font-bold text-white border-b border-slate-800 pb-1.5">Export Settings</h3>
      
      <div class="grid grid-cols-2 gap-2 text-[10px]">
        <div>
          <label class="text-slate-400 block mb-1 font-semibold">Image Format</label>
          <select id="export-format" class="w-full bg-[#151b2a] border border-slate-700 rounded p-1.5 text-xs text-white focus:outline-none">
            <option value="png">PNG (Lossless / High Quality)</option>
            <option value="jpeg">JPG (Compressed / Smaller Size)</option>
            <option value="webp">WEBP (Modern / Balanced)</option>
          </select>
        </div>
        <div>
          <label class="text-slate-400 block mb-1 font-semibold">Resolution / Quality</label>
          <select id="export-quality" class="w-full bg-[#151b2a] border border-slate-700 rounded p-1.5 text-xs text-white focus:outline-none">
            <option value="1">1x (Standard)</option>
            <option value="2" selected>2x (High Definition)</option>
            <option value="4">4x (Ultra HD / 4K)</option>
          </select>
        </div>
      </div>

      <button id="download-btn" class="w-full py-2.5 bg-purple-600 hover:bg-purple-500 text-white font-extrabold text-xs rounded-lg shadow-lg transition mt-2">
        DOWNLOAD COLLAGE
      </button>
    </div>

  </div>

  <!-- NAVIGATION BAR -->
  <nav class="fixed bottom-0 inset-x-0 bg-[#0a0e17] border-t border-slate-800 px-4 py-2 flex justify-around items-center z-50">
    <button data-tab="tab-skins" class="nav-btn text-purple-400 flex flex-col items-center gap-1 text-[10px] font-semibold">
      <i class="fa-solid fa-layer-group text-sm"></i>
      <span>Skins</span>
    </button>
    <button data-tab="tab-layout" class="nav-btn text-slate-400 flex flex-col items-center gap-1 text-[10px] font-semibold">
      <i class="fa-solid fa-border-all text-sm"></i>
      <span>Layout</span>
    </button>
    <button data-tab="tab-effects" class="nav-btn text-slate-400 flex flex-col items-center gap-1 text-[10px] font-semibold">
      <i class="fa-solid fa-wand-magic-sparkles text-sm"></i>
      <span>Effects</span>
    </button>
    <button data-tab="tab-export" class="nav-btn text-slate-400 flex flex-col items-center gap-1 text-[10px] font-semibold">
      <i class="fa-solid fa-download text-sm"></i>
      <span>Export</span>
    </button>
  </nav>

  <script>
    const heroList = [
      "Miya","Balmond","Saber","Alice","Nana","Tigreal","Alucard","Karina","Akai","Franco",
      "Bane","Bruno","Clint","Rafaela","Eudora","Zilong","Fanny","Layla","Minotaur","Lolita",
      "Hayabusa","Freya","Gord","Natalia","Kagura","Chou","Sun","Alpha","Ruby","Yi Sun-shin",
      "Moskov","Johnson","Cyclops","Estes","Hilda","Aurora","Lapu-Lapu","Vexana","Harley","Irithel",
      "Grock","Argus","Odette","Lancelot","Diggie","Hylos","Zhask","Helcurt","Lesley","Pharsa",
      "Angela","Gusion","Valir","Martis","Uranus","Hanabi","Chang'e","Kaja","Selena","Aldous",
      "Claude","Vale","Leomord","Lunox","Hanzo","Belerick","Kimmy","Thamuz","Harith","Minsitthar",
      "Kadita","Badang","Khufra","Granger","Guinevere","Terizla","Esmeralda","Dyrroth","Lylia","Baxia",
      "Masha","Wanwan","Silvanna","Cecilion","Carmilla","Atlas","Popol and Kupa","Yu Zhong","Luo Yi","Benedetta",
      "Khaleed","Barats","Brody","Yve","Mathilda","Paquito","Gloo","Beatrix","Phoveus","Natan",
      "Aulus","Aamon","Valentina","Edith","Yin","Melissa","Xavier","Julian","Fredrinn","Joy",
      "Arlott","Novaria","Ixia","Nolan","Cici","Chip","Zhuxin","Suyou","Lukas","Kalea"
    ];

    let skinCatalog = [];
    let filteredSkins = [];
    let selectedSkinIds = [];
    let activeTileIndex = 0;
    let skinOffsets = {};
    let columns = 4;
    let rows = 4;

    const gridEl = document.getElementById('skins-grid');
    const pickerGridEl = document.getElementById('picker-grid');

    function initCatalog() {
      const catalog = [];
      // Loop over 120 heroes with up to 10 skin slots (1,200 skin slots total)
      heroList.forEach((hero, idx) => {
        const heroId = idx + 1;
        for (let s = 1; s <= 10; s++) {
          const skinId = `${heroId}_${s}`;
          const rarity = s === 1 ? 'Default' : s === 2 ? 'Basic' : s === 3 ? 'Elite' : s === 4 ? 'Special' : s === 5 ? 'Epic' : s === 6 ? 'Collector' : 'Limited';
          
          // Direct Moonton Image URL
          const moontonUrl = `https://akmweb.platform.moonton.com/mlbb/hero/skin/${skinId}.png`;
          // CORS Proxy URL to bypass browser block
          const proxyUrl = `https://wsrv.nl/?url=${encodeURIComponent(moontonUrl)}`;

          catalog.push({
            id: skinId,
            hero: hero,
            skin: `${hero} Skin ${s}`,
            rarity: rarity,
            img: proxyUrl
          });
        }
      });
      return catalog;
    }

    function handleImageError(img, heroName) {
      const parent = img.parentElement;
      if (parent) {
        parent.innerHTML = `
          <div class="w-full h-full flex flex-col items-center justify-center bg-gradient-to-br from-slate-800 to-purple-950 p-1 text-center">
            <i class="fa-solid fa-shield-halved text-purple-400 text-xs mb-1"></i>
            <span class="text-[8px] font-bold text-white leading-tight">${heroName}</span>
          </div>
        `;
      }
    }

    function loadSkinDatabase() {
      skinCatalog = initCatalog();
      filteredSkins = [...skinCatalog];
      selectedSkinIds = skinCatalog.slice(0, 8).map(s => s.id);

      document.getElementById('selected-count-badge').textContent = `${skinCatalog.length} Skins`;
      renderPicker();
      renderGrid();
    }

    // Navigation Tabs
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.replace('text-purple-400', 'text-slate-400'));
        btn.classList.replace('text-slate-400', 'text-purple-400');
        document.querySelectorAll('#control-drawer > div').forEach(div => div.classList.add('hidden'));
        document.getElementById(btn.dataset.tab).classList.remove('hidden');
      });
    });

    // Render Canvas
    function renderGrid() {
      if (!gridEl) return;
      gridEl.style.gridTemplateColumns = `repeat(${columns}, minmax(0, 1fr))`;
      gridEl.innerHTML = '';

      selectedSkinIds.forEach((id, index) => {
        const skin = skinCatalog.find(s => s.id === id);
        if (!skin) return;

        if (!skinOffsets[index]) skinOffsets[index] = { x: 0, y: 0 };
        const offset = skinOffsets[index];

        const tile = document.createElement('div');
        tile.className = `relative aspect-[3/4] bg-slate-800 rounded overflow-hidden border border-slate-700/80 cursor-pointer ${index === activeTileIndex ? 'selected-tile' : ''}`;
        tile.onclick = () => { activeTileIndex = index; renderGrid(); };

        tile.innerHTML = `
          <img src="${skin.img}" class="w-full h-full object-cover transition-transform" style="transform: translate(${offset.x}px, ${offset.y}px);" onerror="handleImageError(this, '${skin.hero}')">
          <div class="absolute top-0 right-0 bg-yellow-500 text-[6px] text-black font-extrabold px-0.5">${skin.rarity}</div>
        `;
        gridEl.appendChild(tile);
      });
    }

    function moveSelectedSkin(direction) {
      if (!skinOffsets[activeTileIndex]) skinOffsets[activeTileIndex] = { x: 0, y: 0 };
      const step = 4;
      if (direction === 'up') skinOffsets[activeTileIndex].y -= step;
      if (direction === 'down') skinOffsets[activeTileIndex].y += step;
      if (direction === 'left') skinOffsets[activeTileIndex].x -= step;
      if (direction === 'right') skinOffsets[activeTileIndex].x += step;
      renderGrid();
    }

    // Picker Grid
    function renderPicker() {
      if (!pickerGridEl) return;
      pickerGridEl.innerHTML = '';
      filteredSkins.slice(0, 60).forEach(skin => {
        const isSelected = selectedSkinIds.includes(skin.id);
        const tile = document.createElement('div');
        tile.className = `relative aspect-[3/4] bg-slate-800 rounded border ${isSelected ? 'border-purple-500 ring-1 ring-purple-500' : 'border-slate-700 opacity-80'} cursor-pointer overflow-hidden`;
        tile.onclick = () => {
          if (isSelected) selectedSkinIds = selectedSkinIds.filter(sId => sId !== skin.id);
          else selectedSkinIds.push(skin.id);
          renderPicker();
          renderGrid();
        };

        tile.innerHTML = `
          <img src="${skin.img}" class="w-full h-full object-cover" onerror="handleImageError(this, '${skin.hero}')">
          <div class="absolute bottom-0 inset-x-0 bg-black/80 text-[6px] text-center truncate py-0.5 text-slate-200">${skin.hero}</div>
        `;
        pickerGridEl.appendChild(tile);
      });
    }

    // Search and Filters
    document.getElementById('skin-search-input').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      filteredSkins = skinCatalog.filter(s => 
        s.hero.toLowerCase().includes(q) || 
        s.skin.toLowerCase().includes(q) || 
        s.rarity.toLowerCase().includes(q)
      );
      renderPicker();
    });

    function filterRarity(rarity) {
      if (rarity === 'ALL') filteredSkins = [...skinCatalog];
      else filteredSkins = skinCatalog.filter(s => s.rarity === rarity);
      renderPicker();
    }

    document.getElementById('clear-all-btn').addEventListener('click', () => {
      selectedSkinIds = [];
      renderPicker();
      renderGrid();
    });

    // Layout Controls
    document.getElementById('cols-input').addEventListener('input', (e) => { columns = parseInt(e.target.value) || 1; renderGrid(); });
    document.getElementById('rows-input').addEventListener('input', (e) => { rows = parseInt(e.target.value) || 1; renderGrid(); });

    // Multi-Effect Controls
    const brightnessEl = document.getElementById('effect-brightness');
    const saturateEl = document.getElementById('effect-saturate');
    const contrastEl = document.getElementById('effect-contrast');
    const hueEl = document.getElementById('effect-hue');
    const blurEl = document.getElementById('effect-blur');
    const grayscaleEl = document.getElementById('effect-grayscale');

    function applyEffects() {
      document.getElementById('collage-canvas').style.filter = `
        brightness(${brightnessEl.value}%) 
        saturate(${saturateEl.value}%) 
        contrast(${contrastEl.value}%) 
        hue-rotate(${hueEl.value}deg) 
        blur(${blurEl.value}px) 
        grayscale(${grayscaleEl.value}%)
      `;
    }

    [brightnessEl, saturateEl, contrastEl, hueEl, blurEl, grayscaleEl].forEach(el => el.addEventListener('input', applyEffects));

    document.getElementById('reset-effects-btn').addEventListener('click', () => {
      brightnessEl.value = 100;
      saturateEl.value = 100;
      contrastEl.value = 100;
      hueEl.value = 0;
      blurEl.value = 0;
      grayscaleEl.value = 0;
      applyEffects();
    });

    // Screenshot Upload
    document.getElementById('screenshot-upload').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          document.getElementById('screenshot-placeholder').classList.add('hidden');
          const img = document.getElementById('screenshot-img');
          img.src = evt.target.result;
          img.classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      }
    });

    // Dynamic High Quality Export
    document.getElementById('download-btn').addEventListener('click', () => {
      const node = document.getElementById('collage-canvas');
      const format = document.getElementById('export-format').value;
      const pixelRatio = parseInt(document.getElementById('export-quality').value) || 2;
      
      const exportBtn = document.getElementById('download-btn');
      exportBtn.textContent = 'GENERATING IMAGE...';
      exportBtn.disabled = true;

      const options = { pixelRatio: pixelRatio, cacheBust: true };

      let exportPromise;
      if (format === 'jpeg') exportPromise = htmlToImage.toJpeg(node, { ...options, quality: 0.95 });
      else if (format === 'webp') exportPromise = htmlToImage.toWebp(node, { ...options, quality: 0.95 });
      else exportPromise = htmlToImage.toPng(node, options);

      exportPromise
        .then(dataUrl => {
          const a = document.createElement('a');
          a.download = `MLBB_Collage_${pixelRatio}x.${format}`;
          a.href = dataUrl;
          a.click();
        })
        .catch(err => console.error("Export error:", err))
        .finally(() => {
          exportBtn.textContent = 'DOWNLOAD COLLAGE';
          exportBtn.disabled = false;
        });
    });

    loadSkinDatabase();
  </script>
</body>
</html>
