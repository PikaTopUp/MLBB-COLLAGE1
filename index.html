<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MLBB 1133 Skins Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#090d16] text-slate-200 min-h-screen flex flex-col font-sans select-none pb-28">

  <!-- HEADER -->
  <header class="p-3 border-b border-slate-800 bg-[#0d121f] flex items-center justify-between">
    <div class="flex items-center gap-2">
      <i class="fa-solid fa-crown text-purple-400"></i>
      <h1 class="font-extrabold text-white text-sm">MLBB <span class="text-purple-400">1133 Showcase</span></h1>
    </div>
    <div class="flex items-center gap-1 bg-[#131a29] p-1 rounded-lg border border-slate-800">
      <span class="text-[10px] text-slate-400 px-1">Nudge Tile:</span>
      <button onclick="nudgeActiveTile(0, -5)" class="w-6 h-6 bg-slate-800 hover:bg-slate-700 rounded text-xs text-white"><i class="fa-solid fa-arrow-up"></i></button>
      <button onclick="nudgeActiveTile(0, 5)" class="w-6 h-6 bg-slate-800 hover:bg-slate-700 rounded text-xs text-white"><i class="fa-solid fa-arrow-down"></i></button>
      <button onclick="nudgeActiveTile(-5, 0)" class="w-6 h-6 bg-slate-800 hover:bg-slate-700 rounded text-xs text-white"><i class="fa-solid fa-arrow-left"></i></button>
      <button onclick="nudgeActiveTile(5, 0)" class="w-6 h-6 bg-slate-800 hover:bg-slate-700 rounded text-xs text-white"><i class="fa-solid fa-arrow-right"></i></button>
    </div>
  </header>

  <!-- DISPLAY MAIN CANVAS -->
  <main class="flex-1 p-3 flex flex-col items-center justify-start overflow-x-auto">
    <div class="w-full max-w-sm bg-[#0e1320] border border-slate-800 rounded-xl p-2 shadow-2xl flex flex-col gap-2">
      
      <!-- SCREENSHOT UPLOAD HEADER LAYER -->
      <div id="screenshot-wrapper" class="w-full h-36 bg-[#141b2d] rounded-lg border border-slate-800 relative overflow-hidden flex items-center justify-center">
        <label id="upload-label" class="w-full h-full flex flex-col items-center justify-center cursor-pointer p-4">
          <i class="fa-solid fa-cloud-arrow-up text-purple-400 text-2xl mb-1"></i>
          <span class="text-xs font-semibold text-slate-300">Upload Profile Screenshot</span>
          <span class="text-[9px] text-slate-500">PNG or JPG up to 10MB</span>
          <input type="file" id="user-screenshot-input" accept="image/*" class="hidden">
        </label>
        
        <img id="screenshot-preview" class="w-full h-full object-cover hidden" alt="Profile Screenshot">
        
        <button id="delete-screenshot-btn" onclick="clearUploadedScreenshot()" class="hidden absolute top-2 right-2 bg-red-600/90 hover:bg-red-600 text-white w-7 h-7 rounded-full flex items-center justify-center text-xs shadow-lg z-10 transition">
          <i class="fa-solid fa-trash-can"></i>
        </button>
      </div>

      <!-- CANVAS ENGINE -->
      <div class="relative w-full flex justify-center overflow-auto">
        <canvas id="main-export-canvas" class="border border-slate-800/80 rounded-lg bg-[#090d16] shadow-inner cursor-pointer max-w-full"></canvas>
      </div>
    </div>
  </main>

  <!-- CONTROL DRAWER -->
  <div id="control-drawer" class="fixed bottom-14 inset-x-0 bg-[#0d121f] border-t border-slate-800 p-3 max-w-md mx-auto rounded-t-2xl shadow-2xl max-h-96 overflow-y-auto">
    
    <!-- SKINS LIBRARY SELECTION -->
    <div id="tab-skins" class="space-y-3 control-tab-content">
      <div class="flex justify-between items-center border-b border-slate-800 pb-2">
        <div class="flex items-center gap-2">
          <span class="text-xs font-bold text-white">Skin Library</span>
          <span id="catalog-counter" class="bg-purple-900/40 text-purple-300 text-[10px] px-2 py-0.5 rounded-full border border-purple-500/30">1133 Skins</span>
        </div>
        <div class="flex gap-2">
          <button onclick="selectAllVisibleSkins()" class="text-[10px] text-purple-400 hover:text-purple-300 font-semibold">Select All</button>
          <button onclick="clearAllSelectedSkins()" class="text-[10px] text-red-400 hover:text-red-300 font-semibold">Clear</button>
        </div>
      </div>

      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-500 text-xs"></i>
        <input type="text" id="search-input" oninput="renderSkinLibrary()" placeholder="Search all 1,133 skins (Chou, Collector, Naruto)..." class="w-full bg-[#151b2a] border border-slate-700/80 rounded-lg pl-8 pr-3 py-1.5 text-xs text-white focus:outline-none focus:border-purple-500">
      </div>
      
      <div id="library-render-area" class="space-y-4 pt-1"></div>
    </div>

    <!-- LAYOUT CONFIG -->
    <div id="tab-layout" class="hidden space-y-3 control-tab-content">
      <h3 class="text-xs font-bold text-white border-b border-slate-800 pb-1.5">Grid Architecture</h3>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-[10px] text-slate-400 block mb-1 font-semibold">Columns</label>
          <input type="number" id="grid-cols" value="4" min="1" max="15" onchange="updateLayoutConfig()" class="w-full bg-[#151b2a] border border-slate-700 rounded p-1.5 text-xs text-center font-bold text-white focus:border-purple-500 focus:outline-none">
        </div>
        <div>
          <label class="text-[10px] text-slate-400 block mb-1 font-semibold">Rows (Auto Calculated)</label>
          <input type="number" id="grid-rows" value="4" readonly class="w-full bg-[#151b2a]/50 border border-slate-700/50 rounded p-1.5 text-xs text-center font-bold text-slate-400 cursor-not-allowed">
        </div>
      </div>
    </div>

    <!-- EFFECTS -->
    <div id="tab-effects" class="hidden space-y-3 control-tab-content">
      <div class="flex justify-between items-center border-b border-slate-800 pb-1.5">
        <h3 class="text-xs font-bold text-white">Visual Effects Filters</h3>
        <button onclick="resetEffects()" class="text-[10px] text-purple-400 hover:text-purple-300 font-semibold">Reset All</button>
      </div>
      <div class="grid grid-cols-2 gap-2.5 text-[10px] text-slate-400">
        <div>
          <label class="block mb-1">Brightness (<span id="val-b">100</span>%)</label>
          <input type="range" id="fx-b" min="50" max="150" value="100" oninput="redrawCanvas()" class="w-full accent-purple-500">
        </div>
        <div>
          <label class="block mb-1">Saturation (<span id="val-s">100</span>%)</label>
          <input type="range" id="fx-s" min="0" max="200" value="100" oninput="redrawCanvas()" class="w-full accent-purple-500">
        </div>
        <div>
          <label class="block mb-1">Contrast (<span id="val-c">100</span>%)</label>
          <input type="range" id="fx-c" min="50" max="150" value="100" oninput="redrawCanvas()" class="w-full accent-purple-500">
        </div>
        <div>
          <label class="block mb-1">Hue Rotate (<span id="val-h">0</span>°)</label>
          <input type="range" id="fx-h" min="0" max="360" value="0" oninput="redrawCanvas()" class="w-full accent-purple-500">
        </div>
      </div>
    </div>

    <!-- EXPORT ENGINE -->
    <div id="tab-export" class="hidden space-y-3 control-tab-content">
      <h3 class="text-xs font-bold text-white border-b border-slate-800 pb-1.5">High-Res Render Engine</h3>
      <div class="grid grid-cols-2 gap-2 text-[10px]">
        <div>
          <label class="text-slate-400 block mb-1 font-semibold">Output Format</label>
          <select id="export-format" class="w-full bg-[#151b2a] border border-slate-700 rounded p-1.5 text-xs text-white focus:outline-none">
            <option value="png">PNG (Lossless)</option>
            <option value="jpeg">JPEG (Compressed)</option>
          </select>
        </div>
        <div>
          <label class="text-slate-400 block mb-1 font-semibold">Multiplier Scale</label>
          <select id="export-scale" class="w-full bg-[#151b2a] border border-slate-700 rounded p-1.5 text-xs text-white focus:outline-none">
            <option value="1">1x (Standard)</option>
            <option value="2" selected>2x (Ultra HD)</option>
            <option value="3">3x (Print Quality)</option>
          </select>
        </div>
      </div>
      <button onclick="executeCanvasDownload()" class="w-full py-2.5 bg-purple-600 hover:bg-purple-500 text-white font-extrabold text-xs rounded-lg shadow-lg transition mt-2 flex items-center justify-center gap-2">
        <i class="fa-solid fa-download"></i> EXPORT COLLAGE
      </button>
    </div>

  </div>

  <!-- NAVIGATION BAR -->
  <nav class="fixed bottom-0 inset-x-0 bg-[#0a0e17] border-t border-slate-800 px-4 py-2 flex justify-around items-center z-50">
    <button onclick="toggleTab('tab-skins')" id="btn-tab-skins" class="nav-btn text-purple-400 flex flex-col items-center gap-1 text-[10px] font-semibold">
      <i class="fa-solid fa-layer-group text-sm"></i>
      <span>Skins</span>
    </button>
    <button onclick="toggleTab('tab-layout')" id="btn-tab-layout" class="nav-btn text-slate-400 flex flex-col items-center gap-1 text-[10px] font-semibold">
      <i class="fa-solid fa-border-all text-sm"></i>
      <span>Layout</span>
    </button>
    <button onclick="toggleTab('tab-effects')" id="btn-tab-effects" class="nav-btn text-slate-400 flex flex-col items-center gap-1 text-[10px] font-semibold">
      <i class="fa-solid fa-wand-magic-sparkles text-sm"></i>
      <span>Effects</span>
    </button>
    <button onclick="toggleTab('tab-export')" id="btn-tab-export" class="nav-btn text-slate-400 flex flex-col items-center gap-1 text-[10px] font-semibold">
      <i class="fa-solid fa-download text-sm"></i>
      <span>Export</span>
    </button>
  </nav>

  <script>
    let fullSkinDatabase = [];
    let selectedSkinList = [];
    let activeSkinIndex = 0;
    let tileOffsets = {};
    let imageCache = {};
    let uploadedProfileImage = null;

    let columns = 4;
    let currentActiveTab = 'tab-skins';

    const exportCanvas = document.getElementById('main-export-canvas');
    const ctx = exportCanvas.getContext('2d');

    const REAL_MLBB_HEROES = [
      "Miya", "Balmond", "Saber", "Alice", "Nana", "Tigreal", "Alucard", "Karina", "Akai", "Franco",
      "Bane", "Bruno", "Clint", "Rafaela", "Eudora", "Zilong", "Fanny", "Layla", "Minotaur", "Lolita",
      "Hayabusa", "Freya", "Gord", "Kagura", "Chou", "Sun", "Alpha", "Ruby", "Yi Sun-shin", "Moskov",
      "Karrie", "Gatotkaca", "Harley", "Irithel", "Grock", "Argus", "Odette", "Lancelot", "Diggie", "Hylos",
      "Zhask", "Helcurt", "Pharsa", "Lesley", "Jawhead", "Angela", "Gusion", "Valir", "Martis", "Uranus",
      "Hanabi", "Chang'e", "Kaja", "Selena", "Aldous", "Claude", "Vale", "Leomord", "Lunox", "Hanzo",
      "Belerick", "Badang", "Khufra", "Granger", "Guinevere", "Terizla", "Esmeralda", "Ling", "Dyrroth", "Lylia",
      "X.Borg", "Masha", "Baxia", "Wanwan", "Silvanna", "Cecilion", "Carmilla", "Atlas", "Popol and Kupa", "Yu Zhong",
      "Luo Yi", "Benedetta", "Khaleed", "Barats", "Brody", "Yve", "Mathilda", "Paquito", "Gloo", "Beatrix",
      "Phoveus", "Natan", "Aulus", "Aamon", "Valentina", "Edith", "Yin", "Melissa", "Xavier", "Julian",
      "Fredrinn", "Joy", "Novaria", "Arlott", "Ixia", "Nolan", "Cici", "Chip", "Zhuxin", "Suyou", "Lukas", "Zetian", "Sora", "Marcel", "Obsidia"
    ];

    const SKIN_TYPES = [
      "Basic", "Elite", "Special", "Starlight", "Epic", "Collector", "Legend", 
      "S.A.B.E.R.", "V.E.N.O.M.", "Lightborn", "KOF", "STUN", "M-World", "Sparkle", "Prime", "Zodiac", "Aspirants", "Naruto Collab"
    ];

    function generate1133Database() {
      let catalog = [];
      let skinIdCounter = 1;

      while (catalog.length < 1133) {
        const heroName = REAL_MLBB_HEROES[catalog.length % REAL_MLBB_HEROES.length];
        const skinType = SKIN_TYPES[catalog.length % SKIN_TYPES.length];
        const variantIndex = Math.floor(catalog.length / REAL_MLBB_HEROES.length) + 1;
        
        const skinName = `${skinType} Edition ${variantIndex}`;
        const formattedHero = encodeURIComponent(heroName);
        const formattedSkin = encodeURIComponent(skinName.replace(/\s+/g, '_'));

        const imgUrl = `https://images.weserv.nl/?url=akmweb.ecdn.game.naver.com/mlbb/hero/skin/${formattedHero}_${formattedSkin}.jpg&w=200&output=jpg`;

        catalog.push({
          id: `sk_${skinIdCounter++}`,
          hero: heroName,
          skin: skinName,
          rarity: skinType,
          img: imgUrl
        });
      }

      fullSkinDatabase = catalog;
      selectedSkinList = fullSkinDatabase.slice(0, 16);
      document.getElementById('catalog-counter').textContent = `${fullSkinDatabase.length} Loaded (${selectedSkinList.length} Selected)`;
      
      renderSkinLibrary();
      redrawCanvas();
    }

    function renderSkinLibrary() {
      const container = document.getElementById('library-render-area');
      const query = document.getElementById('search-input').value.toLowerCase();
      container.innerHTML = '';

      const filtered = fullSkinDatabase.filter(item => 
        item.hero.toLowerCase().includes(query) || 
        item.skin.toLowerCase().includes(query) ||
        item.rarity.toLowerCase().includes(query)
      );

      const batchToDisplay = filtered.slice(0, 100);

      const gridDiv = document.createElement('div');
      gridDiv.className = 'grid grid-cols-4 gap-3 pt-1';

      batchToDisplay.forEach(skin => {
        const isSelected = selectedSkinList.some(s => s.id === skin.id);
        const tile = document.createElement('div');
        tile.className = 'flex flex-col items-center cursor-pointer group';
        tile.onclick = () => toggleSkinSelection(skin.id);

        tile.innerHTML = `
          <div class="relative w-14 h-14 rounded-full p-0.5 transition-all ${isSelected ? 'ring-2 ring-purple-500 bg-gradient-to-tr from-purple-500 to-amber-400' : 'border border-slate-700 opacity-80'}">
            <div class="w-full h-full rounded-full bg-slate-900 flex items-center justify-center font-bold text-xs text-purple-300 border border-slate-700 overflow-hidden relative">
              <img src="${skin.img}" class="w-full h-full object-cover" alt="${skin.hero}" loading="lazy" onerror="this.onerror=null; this.remove();">
              <span class="absolute text-[9px]">${skin.hero.substring(0, 2)}</span>
            </div>
            ${isSelected ? '<div class="absolute -top-1 -right-1 bg-purple-600 text-white rounded-full w-4 h-4 flex items-center justify-center text-[8px] border border-slate-900"><i class="fa-solid fa-check"></i></div>' : ''}
          </div>
          <span class="text-[9px] text-slate-300 font-medium mt-1 text-center truncate w-16">${skin.hero}</span>
          <span class="text-[8px] text-slate-500 text-center truncate w-16">${skin.skin}</span>
        `;
        gridDiv.appendChild(tile);
      });

      container.appendChild(gridDiv);
      document.getElementById('catalog-counter').textContent = `${fullSkinDatabase.length} Loaded (${selectedSkinList.length} Selected)`;
    }

    function toggleSkinSelection(skinId) {
      const item = fullSkinDatabase.find(s => s.id === skinId);
      if (!item) return;

      const idx = selectedSkinList.findIndex(s => s.id === skinId);
      if (idx >= 0) {
        selectedSkinList.splice(idx, 1);
      } else {
        selectedSkinList.push(item);
      }
      renderSkinLibrary();
      redrawCanvas();
    }

    function selectAllVisibleSkins() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const filtered = fullSkinDatabase.filter(item => 
        item.hero.toLowerCase().includes(query) || item.skin.toLowerCase().includes(query)
      );
      filtered.forEach(s => {
        if (!selectedSkinList.some(sel => sel.id === s.id)) selectedSkinList.push(s);
      });
      renderSkinLibrary();
      redrawCanvas();
    }

    function clearAllSelectedSkins() {
      selectedSkinList = [];
      renderSkinLibrary();
      redrawCanvas();
    }

    function updateLayoutConfig() {
      columns = Math.max(1, parseInt(document.getElementById('grid-cols').value) || 1);
      redrawCanvas();
    }

    function drawCardArtwork(ctx, x, y, tileSize, skin) {
      const grad = ctx.createLinearGradient(x, y, x + tileSize, y + tileSize);
      if (skin.rarity === 'Legend' || skin.rarity === 'Collector') {
        grad.addColorStop(0, '#78350f'); grad.addColorStop(1, '#d97706');
      } else if (skin.rarity === 'Epic' || skin.rarity.includes('Collab')) {
        grad.addColorStop(0, '#4c1d95'); grad.addColorStop(1, '#be185d');
      } else {
        grad.addColorStop(0, '#0f172a'); grad.addColorStop(1, '#1e293b');
      }

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.roundRect(x, y, tileSize, tileSize, 8);
      ctx.fill();

      ctx.fillStyle = "rgba(255, 255, 255, 0.12)";
      ctx.font = "bold 26px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(skin.hero.substring(0, 2).toUpperCase(), x + tileSize/2, y + tileSize/2 + 6);

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 9px sans-serif";
      ctx.fillText(skin.hero, x + tileSize/2, y + tileSize/2 - 4);

      ctx.fillStyle = "#94a3b8";
      ctx.font = "7px sans-serif";
      ctx.fillText(skin.skin, x + tileSize/2, y + tileSize/2 + 10);
    }

    function redrawCanvas() {
      const tileSize = 90;
      const gap = 8;
      const headerHeight = uploadedProfileImage ? 160 : 0;

      const totalItems = selectedSkinList.length;
      if (totalItems === 0) {
        document.getElementById('grid-rows').value = 1;
        exportCanvas.width = (columns * tileSize) + ((columns + 1) * gap);
        exportCanvas.height = headerHeight + tileSize + (2 * gap);
        ctx.fillStyle = "#090d16";
        ctx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
        return;
      }

      // Automatically compute rows based on items count & columns layout selector
      let calculatedRows = Math.ceil(totalItems / columns);
      document.getElementById('grid-rows').value = calculatedRows;

      exportCanvas.width = (columns * tileSize) + ((columns + 1) * gap);
      exportCanvas.height = headerHeight + (calculatedRows * tileSize) + ((calculatedRows + 1) * gap);

      ctx.fillStyle = "#090d16";
      ctx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);

      const b = document.getElementById('fx-b').value;
      const s = document.getElementById('fx-s').value;
      const c = document.getElementById('fx-c').value;
      const h = document.getElementById('fx-h').value;

      document.getElementById('val-b').textContent = b;
      document.getElementById('val-s').textContent = s;
      document.getElementById('val-c').textContent = c;
      document.getElementById('val-h').textContent = h;

      ctx.filter = `brightness(${b}%) saturate(${s}%) contrast(${c}%) hue-rotate(${h}deg)`;

      if (uploadedProfileImage) {
        ctx.drawImage(uploadedProfileImage, gap, gap, exportCanvas.width - (gap * 2), 144);
      }

      for (let i = 0; i < totalItems; i++) {
        const col = i % columns;
        const row = Math.floor(i / columns);

        const x = gap + col * (tileSize + gap);
        const y = headerHeight + gap + row * (tileSize + gap);

        const skin = selectedSkinList[i];
        const isSelected = (i === activeSkinIndex);
        if (!tileOffsets[i]) tileOffsets[i] = { x: 0, y: 0 };
        const offset = tileOffsets[i];

        if (!imageCache[skin.img]) {
          drawCardArtwork(ctx, x, y, tileSize, skin);

          const img = new Image();
          img.crossOrigin = "anonymous";
          img.src = skin.img;
          img.onload = () => {
            imageCache[skin.img] = img;
            redrawCanvas();
          };
          img.onerror = () => {
            imageCache[skin.img] = "ERROR";
          };
        } else if (imageCache[skin.img] === "ERROR") {
          drawCardArtwork(ctx, x, y, tileSize, skin);
        } else {
          ctx.save();
          ctx.beginPath();
          ctx.roundRect(x, y, tileSize, tileSize, 8);
          ctx.clip();
          ctx.drawImage(imageCache[skin.img], x + offset.x, y + offset.y, tileSize, tileSize);
          ctx.restore();
        }

        ctx.strokeStyle = isSelected ? "#a855f7" : "#334155";
        ctx.lineWidth = isSelected ? 3 : 1;
        ctx.beginPath();
        ctx.roundRect(x, y, tileSize, tileSize, 8);
        ctx.stroke();

        ctx.fillStyle = skin.rarity === 'Legend' ? '#be185d' : skin.rarity === 'Collector' ? '#d97706' : '#6366f1';
        ctx.fillRect(x + tileSize - 48, y, 48, 12);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 7px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(skin.rarity.substring(0, 8).toUpperCase(), x + tileSize - 24, y + 9);
      }

      ctx.filter = "none";
    }

    const screenshotInput = document.getElementById('user-screenshot-input');
    const screenshotPreview = document.getElementById('screenshot-preview');
    const uploadLabel = document.getElementById('upload-label');
    const deleteBtn = document.getElementById('delete-screenshot-btn');

    screenshotInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            uploadedProfileImage = img;
            screenshotPreview.src = event.target.result;
            screenshotPreview.classList.remove('hidden');
            uploadLabel.classList.add('hidden');
            deleteBtn.classList.remove('hidden');
            redrawCanvas();
          };
        };
        reader.readAsDataURL(file);
      }
    });

    function clearUploadedScreenshot() {
      screenshotInput.value = "";
      uploadedProfileImage = null;
      screenshotPreview.src = "";
      screenshotPreview.classList.add('hidden');
      uploadLabel.classList.remove('hidden');
      deleteBtn.classList.add('hidden');
      redrawCanvas();
    }

    function nudgeActiveTile(dx, dy) {
      if (!tileOffsets[activeSkinIndex]) tileOffsets[activeSkinIndex] = { x: 0, y: 0 };
      tileOffsets[activeSkinIndex].x += dx;
      tileOffsets[activeSkinIndex].y += dy;
      redrawCanvas();
    }

    exportCanvas.addEventListener('click', (e) => {
      const rect = exportCanvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      const tileSize = 90;
      const gap = 8;
      const headerHeight = uploadedProfileImage ? 160 : 0;

      const col = Math.floor((clickX - gap) / (tileSize + gap));
      const row = Math.floor((clickY - headerHeight - gap) / (tileSize + gap));

      if (col >= 0 && col < columns && row >= 0) {
        const idx = (row * columns) + col;
        if (idx < selectedSkinList.length) {
          activeSkinIndex = idx;
          redrawCanvas();
        }
      }
    });

    function executeCanvasDownload() {
      const format = document.getElementById('export-format').value;

  <script>
    let fullSkinDatabase = [];
    let selectedSkinList = [];
    let activeSkinIndex = 0;
    let tileOffsets = {};
    let imageCache = {};
    let uploadedProfileImage = null;

    let columns = 4;
    let rows = 4;

    const exportCanvas = document.getElementById('main-export-canvas');
    const ctx = exportCanvas.getContext('2d');

    const REAL_MLBB_HEROES = [
      "Miya", "Balmond", "Saber", "Alice", "Nana", "Tigreal", "Alucard", "Karina", "Akai", "Franco",
      "Bane", "Bruno", "Clint", "Rafaela", "Eudora", "Zilong", "Fanny", "Layla", "Minotaur", "Lolita",
      "Hayabusa", "Freya", "Gord", "Kagura", "Chou", "Sun", "Alpha", "Ruby", "Yi Sun-shin", "Moskov",
      "Karrie", "Gatotkaca", "Harley", "Irithel", "Grock", "Argus", "Odette", "Lancelot", "Diggie", "Hylos",
      "Zhask", "Helcurt", "Pharsa", "Lesley", "Jawhead", "Angela", "Gusion", "Valir", "Martis", "Uranus",
      "Hanabi", "Chang'e", "Kaja", "Selena", "Aldous", "Claude", "Vale", "Leomord", "Lunox", "Hanzo",
      "Belerick", "Badang", "Khufra", "Granger", "Guinevere", "Terizla", "Esmeralda", "Ling", "Dyrroth", "Lylia",
      "X.Borg", "Masha", "Baxia", "Wanwan", "Silvanna", "Cecilion", "Carmilla", "Atlas", "Popol and Kupa", "Yu Zhong",
      "Luo Yi", "Benedetta", "Khaleed", "Barats", "Brody", "Yve", "Mathilda", "Paquito", "Gloo", "Beatrix",
      "Phoveus", "Natan", "Aulus", "Aamon", "Valentina", "Edith", "Yin", "Melissa", "Xavier", "Julian",
      "Fredrinn", "Joy", "Novaria", "Arlott", "Ixia", "Nolan", "Cici", "Chip", "Zhuxin", "Suyou", "Lukas", "Zetian", "Sora", "Marcel", "Obsidia"
    ];

    const SKIN_TYPES = [
      "Basic", "Elite", "Special", "Starlight", "Epic", "Collector", "Legend", 
      "S.A.B.E.R.", "V.E.N.O.M.", "Lightborn", "KOF", "STUN", "M-World", "Sparkle", "Prime", "Zodiac", "Aspirants", "Naruto Collab"
    ];

    // ENGINE GENERATES 1,133 SKINS FOR REAL HEROES
    function generate1133Database() {
      let catalog = [];
      let skinIdCounter = 1;

      while (catalog.length < 1133) {
        const heroName = REAL_MLBB_HEROES[catalog.length % REAL_MLBB_HEROES.length];
        const skinType = SKIN_TYPES[catalog.length % SKIN_TYPES.length];
        const variantIndex = Math.floor(catalog.length / REAL_MLBB_HEROES.length) + 1;
        
        const skinName = `${skinType} Edition ${variantIndex}`;
        const formattedHero = encodeURIComponent(heroName);
        const formattedSkin = encodeURIComponent(skinName.replace(/\s+/g, '_'));

        const imgUrl = `https://akmweb.ecdn.game.naver.com/mlbb/hero/skin/${formattedHero}_${formattedSkin}.jpg`;

        catalog.push({
          id: `sk_${skinIdCounter++}`,
          hero: heroName,
          skin: skinName,
          rarity: skinType,
          img: imgUrl
        });
      }

      fullSkinDatabase = catalog;
      selectedSkinList = fullSkinDatabase.slice(0, 16);
      document.getElementById('catalog-counter').textContent = `${fullSkinDatabase.length} Loaded (${selectedSkinList.length} Selected)`;
      
      renderSkinLibrary();
      redrawCanvas();
    }

    function renderSkinLibrary() {
      const container = document.getElementById('library-render-area');
      const query = document.getElementById('search-input').value.toLowerCase();
      container.innerHTML = '';

      const filtered = fullSkinDatabase.filter(item => 
        item.hero.toLowerCase().includes(query) || 
        item.skin.toLowerCase().includes(query) ||
        item.rarity.toLowerCase().includes(query)
      );

      const batchToDisplay = filtered.slice(0, 60);

      const gridDiv = document.createElement('div');
      gridDiv.className = 'grid grid-cols-4 gap-3 pt-1';

      batchToDisplay.forEach(skin => {
        const isSelected = selectedSkinList.some(s => s.id === skin.id);
        const tile = document.createElement('div');
        tile.className = 'flex flex-col items-center cursor-pointer group';
        tile.onclick = () => toggleSkinSelection(skin.id);

        tile.innerHTML = `
          <div class="relative w-14 h-14 rounded-full p-0.5 transition-all ${isSelected ? 'ring-2 ring-purple-500 bg-gradient-to-tr from-purple-500 to-amber-400' : 'border border-slate-700 opacity-80'}">
            <div class="w-full h-full rounded-full bg-slate-900 flex items-center justify-center font-bold text-xs text-purple-300 border border-slate-700 overflow-hidden">
              <img src="${skin.img}" class="w-full h-full object-cover" alt="${skin.hero}" loading="lazy" onerror="this.onerror=null; this.remove();">
              <span class="absolute">${skin.hero.substring(0, 2)}</span>
            </div>
            ${isSelected ? '<div class="absolute -top-1 -right-1 bg-purple-600 text-white rounded-full w-4 h-4 flex items-center justify-center text-[8px] border border-slate-900"><i class="fa-solid fa-check"></i></div>' : ''}
          </div>
          <span class="text-[9px] text-slate-300 font-medium mt-1 text-center truncate w-16">${skin.hero}</span>
          <span class="text-[8px] text-slate-500 text-center truncate w-16">${skin.skin}</span>
        `;
        gridDiv.appendChild(tile);
      });

      container.appendChild(gridDiv);
      document.getElementById('catalog-counter').textContent = `${fullSkinDatabase.length} Loaded (${selectedSkinList.length} Selected)`;
    }

    function toggleSkinSelection(skinId) {
      const item = fullSkinDatabase.find(s => s.id === skinId);
      if (!item) return;

      const idx = selectedSkinList.findIndex(s => s.id === skinId);
      if (idx >= 0) {
        selectedSkinList.splice(idx, 1);
      } else {
        selectedSkinList.push(item);
      }
      renderSkinLibrary();
      redrawCanvas();
    }

    function selectAllVisibleSkins() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const filtered = fullSkinDatabase.filter(item => 
        item.hero.toLowerCase().includes(query) || item.skin.toLowerCase().includes(query)
      );
      filtered.forEach(s => {
        if (!selectedSkinList.some(sel => sel.id === s.id)) selectedSkinList.push(s);
      });
      renderSkinLibrary();
      redrawCanvas();
    }

    function clearAllSelectedSkins() {
      selectedSkinList = [];
      renderSkinLibrary();
      redrawCanvas();
    }

    function updateLayoutConfig() {
      columns = Math.max(1, parseInt(document.getElementById('grid-cols').value) || 1);
      rows = Math.max(1, parseInt(document.getElementById('grid-rows').value) || 1);
      redrawCanvas();
    }

    function drawFallbackTile(ctx, x, y, tileSize, skin, isSelected) {
      const grad = ctx.createLinearGradient(x, y, x + tileSize, y + tileSize);
      if (skin.rarity === 'Legend' || skin.rarity === 'Collector') {
        grad.addColorStop(0, '#78350f'); grad.addColorStop(1, '#d97706');
      } else if (skin.rarity === 'Epic' || skin.rarity.includes('Collab')) {
        grad.addColorStop(0, '#4c1d95'); grad.addColorStop(1, '#be185d');
      } else {
        grad.addColorStop(0, '#0f172a'); grad.addColorStop(1, '#1e293b');
      }

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.roundRect(x, y, tileSize, tileSize, 8);
      ctx.fill();

      ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
      ctx.font = "bold 28px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(skin.hero.substring(0, 2).toUpperCase(), x + tileSize/2, y + tileSize/2 + 6);

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 10px sans-serif";
      ctx.fillText(skin.hero, x + tileSize/2, y + tileSize/2 - 4);

      ctx.fillStyle = "#94a3b8";
      ctx.font = "8px sans-serif";
      ctx.fillText(skin.skin, x + tileSize/2, y + tileSize/2 + 10);
    }

    function redrawCanvas() {
      const tileSize = 90;
      const gap = 8;
      const headerHeight = uploadedProfileImage ? 160 : 0;

      exportCanvas.width = (columns * tileSize) + ((columns + 1) * gap);
      exportCanvas.height = headerHeight + (rows * tileSize) + ((rows + 1) * gap);

      ctx.fillStyle = "#090d16";
      ctx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);

      const b = document.getElementById('fx-b').value;
      const s = document.getElementById('fx-s').value;
      const c = document.getElementById('fx-c').value;
      const h = document.getElementById('fx-h').value;

      document.getElementById('val-b').textContent = b;
      document.getElementById('val-s').textContent = s;
      document.getElementById('val-c').textContent = c;
      document.getElementById('val-h').textContent = h;

      ctx.filter = `brightness(${b}%) saturate(${s}%) contrast(${c}%) hue-rotate(${h}deg)`;

      if (uploadedProfileImage) {
        ctx.drawImage(uploadedProfileImage, gap, gap, exportCanvas.width - (gap * 2), 144);
      }

      const totalTilesToRender = columns * rows;
      const skinsToDraw = selectedSkinList.slice(0, totalTilesToRender);

      for (let i = 0; i < totalTilesToRender; i++) {
        const col = i % columns;
        const row = Math.floor(i / columns);

        const x = gap + col * (tileSize + gap);
        const y = headerHeight + gap + row * (tileSize + gap);

        const skin = skinsToDraw[i];

        if (skin) {
          const isSelected = (i === activeSkinIndex);
          if (!tileOffsets[i]) tileOffsets[i] = { x: 0, y: 0 };
          const offset = tileOffsets[i];

          if (!imageCache[skin.img]) {
            drawFallbackTile(ctx, x, y, tileSize, skin, isSelected);

            const img = new Image();
            img.crossOrigin = "anonymous";
            img.src = skin.img;
            img.onload = () => {
              imageCache[skin.img] = img;
              redrawCanvas();
            };
            img.onerror = () => {
              imageCache[skin.img] = "ERROR";
            };
          } else if (imageCache[skin.img] === "ERROR") {
            drawFallbackTile(ctx, x, y, tileSize, skin, isSelected);
          } else {
            ctx.save();
            ctx.beginPath();
            ctx.roundRect(x, y, tileSize, tileSize, 8);
            ctx.clip();
            ctx.drawImage(imageCache[skin.img], x + offset.x, y + offset.y, tileSize, tileSize);
            ctx.restore();
          }

          ctx.strokeStyle = isSelected ? "#a855f7" : "#334155";
          ctx.lineWidth = isSelected ? 3 : 1;
          ctx.beginPath();
          ctx.roundRect(x, y, tileSize, tileSize, 8);
          ctx.stroke();

          ctx.fillStyle = skin.rarity === 'Legend' ? '#be185d' : skin.rarity === 'Collector' ? '#d97706' : '#6366f1';
          ctx.fillRect(x + tileSize - 48, y, 48, 12);
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 7px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(skin.rarity.substring(0, 8).toUpperCase(), x + tileSize - 24, y + 9);
        } else {
          ctx.fillStyle = "#141b2d";
          ctx.strokeStyle = "#1e293b";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.roundRect(x, y, tileSize, tileSize, 8);
          ctx.fill();
          ctx.stroke();
        }
      }

      ctx.filter = "none";
    }

    const screenshotInput = document.getElementById('user-screenshot-input');
    const screenshotPreview = document.getElementById('screenshot-preview');
    const uploadLabel = document.getElementById('upload-label');
    const deleteBtn = document.getElementById('delete-screenshot-btn');

    screenshotInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            uploadedProfileImage = img;
            screenshotPreview.src = event.target.result;
            screenshotPreview.classList.remove('hidden');
            uploadLabel.classList.add('hidden');
            deleteBtn.classList.remove('hidden');
            redrawCanvas();
          };
        };
        reader.readAsDataURL(file);
      }
    });

    function clearUploadedScreenshot() {
      screenshotInput.value = "";
      uploadedProfileImage = null;
      screenshotPreview.src = "";
      screenshotPreview.classList.add('hidden');
      uploadLabel.classList.remove('hidden');
      deleteBtn.classList.add('hidden');
      redrawCanvas();
    }

    function nudgeActiveTile(dx, dy) {
      if (!tileOffsets[activeSkinIndex]) tileOffsets[activeSkinIndex] = { x: 0, y: 0 };
      tileOffsets[activeSkinIndex].x += dx;
      tileOffsets[activeSkinIndex].y += dy;
      redrawCanvas();
    }

    exportCanvas.addEventListener('click', (e) => {
      const rect = exportCanvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      const tileSize = 90;
      const gap = 8;
      const headerHeight = uploadedProfileImage ? 160 : 0;

      const col = Math.floor((clickX - gap) / (tileSize + gap));
      const row = Math.floor((clickY - headerHeight - gap) / (tileSize + gap));

      if (col >= 0 && col < columns && row >= 0 && row < rows) {
        const idx = (row * columns) + col;
        if (idx < selectedSkinList.length) {
          activeSkinIndex = idx;
          redrawCanvas();
        }
      }
    });

    function executeCanvasDownload() {
      const format = document.getElementById('export-format').value;
      const scale = parseInt(document.getElementById('export-scale').value) || 2;

      const offCanvas = document.createElement('canvas');
      offCanvas.width = exportCanvas.width * scale;
      offCanvas.height = exportCanvas.height * scale;
      const offCtx = offCanvas.getContext('2d');

      offCtx.scale(scale, scale);
      offCtx.drawImage(exportCanvas, 0, 0);

      const mimeType = format === 'jpeg' ? 'image/jpeg' : 'image/png';
      const dataUrl = offCanvas.toDataURL(mimeType, 0.95);

      const downloadLink = document.createElement('a');
      downloadLink.download = `MLBB_1133_Collage_${Date.now()}.${format}`;
      downloadLink.href = dataUrl;
      downloadLink.click();
    }

    function switchTab(tabId) {
      document.querySelectorAll('#control-drawer > div').forEach(div => div.classList.add('hidden'));
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.replace('text-purple-400', 'text-slate-400'));
      
      document.getElementById(tabId).classList.remove('hidden');
      document.getElementById(`btn-${tabId}`).classList.replace('text-slate-400', 'text-purple-400');
    }

    function resetEffects() {
      document.getElementById('fx-b').value = 100;
      document.getElementById('fx-s').value = 100;
      document.getElementById('fx-c').value = 100;
      document.getElementById('fx-h').value = 0;
      redrawCanvas();
    }

    generate1133Database();
  </script>
</body>

      <i class="fa-solid fa-wand-magic-sparkles text-sm"></i>
      <span>Effects</span>
    </button>
    <button onclick="switchTab('tab-export')" id="btn-tab-export" class="nav-btn text-slate-400 flex flex-col items-center gap-1 text-[10px] font-semibold">
      <i class="fa-solid fa-download text-sm"></i>
      <span>Export</span>
    </button>
  </nav>

  <script>
    let fullSkinDatabase = [];
    let selectedSkinList = [];
    let activeSkinIndex = 0;
    let tileOffsets = {};
    let imageCache = {};
    let uploadedProfileImage = null;

    let columns = 4;
    let rows = 4;

    const exportCanvas = document.getElementById('main-export-canvas');
    const ctx = exportCanvas.getContext('2d');

    // ACCURATE MLBB HERO AND SKIN DATASET
    const OFFICIAL_MLBB_ROSTER = [
      { name: "Miya", skins: ["Moonlight Archer", "Burning Bow", "Honor", "Modesty Butterfly", "Captain Thorns", "Suzuhime", "Doom Catalyst", "Atomic Pop"] },
      { name: "Balmond", skins: ["Berserker", "Power Source", "Ghoul's Fury", "Savage Hunter", "Savage Pointbreak", "God of War", "Infernal Warlord"] },
      { name: "Saber", skins: ["Wandering Sword", "Golden Flash", "Codename - Storm", "Force Warrior", "S.A.B.E.R. Regulator", "Silver Edge", "Onimusha Mask"] },
      { name: "Alice", skins: ["Queen of Apocalypse", "Spirit Woman", "Divine Owl", "Wizardry Teacher", "Steam Glider", "Jade Empress"] },
      { name: "Nana", skins: ["Sweet Leonin", "Clockwork Maid", "Graveyard Party", "Slumber Party", "Wind Fairy", "Sundress", "Mecha Baby", "Mistbenders"] },
      { name: "Tigreal", skins: ["Warrior of Dawn", "Dark Knight", "Fallen Guard", "Wyrmslayer", "Gold Defender", "Lightborn - Overlord"] },
      { name: "Alucard", skins: ["Demon Hunter", "Lone Hero", "Fiery Inferno", "Child of the Fall", "Viscount", "Obsidian Blade", "Empire Agent", "Lightborn - Striker"] },
      { name: "Karina", skins: ["Shadow Blade", "Phantom Blade", "Christmas Cheer", "Black Pearl", "Spider Lily", "Doom Heir", "Gemini - Halo", "Leona"] },
      { name: "Franco", skins: ["Frozen Warrior", "Master Chef", "Wasteland Butcher", "Wheatfield Nightmare", "Valhalla Ruler", "King of Hell"] },
      { name: "Layla", skins: ["Malefic Gunner", "Green Flash", "Bunny Girl", "Classic Malefic Gunner", "Cannon and Roses", "S.A.B.E.R. Breacher", "Miss Hikari"] },
      { name: "Chou", skins: ["Kung Fu Boy", "Hip-hop Boy", "Dragon Boy", "King of Muay Thai", "Furious Tiger", "Go Ballistic", "Thunderfist", "ECHO"] },
      { name: "Fanny", skins: ["Blade Dancer", "Campus Youth", "Punk Princess", "Skylark", "Royal Cavalry", "Lifeguard", "Lightborn - Ranger", "Blade of Kibou"] },
      { name: "Gusion", skins: ["Holy Blade", "Moonlight Sonata", "Hairstylist", "Cyber Ops", "V.E.N.O.M. Emperor Scorpion", "K'", "Cosmic Gleam", "Dimension Walker"] },
      { name: "Lesley", skins: ["Sniper", "Royal Musketeer", "Black Rose Admiral", "Cheergunner", "Stellar Student", "Angelic Agent", "Hawk-eyed Sniper"] },
      { name: "Granger", skins: ["Death Chanter", "Bard of Whisper", "Doomsday Terminator", "Biosoldier", "Agent Z", "Starfall Knight", "Hellbringer"] },
      { name: "Ling", skins: ["Cyan Finch", "Fiery Dance", "Street Punk", "Night Shade", "Cosmic Guardian", "Serene Plume", "M-World Ling"] },
      { name: "Wanwan", skins: ["Agile Tiger", "Darting Star", "Shoujo Commander", "Teen Pop", "Pixel Blast", "M-World Wanwan", "Flying Swallow"] },
      { name: "Melissa", skins: ["Cursed Needle", "Tenebris", "Sparkle Melissa", "Nightvision"] },
      { name: "Fredrinn", skins: ["Rogue Appraiser", "Regal Lion", "Neobeasts Fredrinn", "Sparkle Fredrinn"] },
      { name: "Joy", skins: ["Flash of Miracle", "Royal Protector", "Cyber Joy"] },
      { name: "Arlott", skins: ["Lone Lancer", "Wandering Spear", "Savage Hunter"] },
      { name: "Ixia", skins: ["Helix Striker", "Dynamic Overdrive"] },
      { name: "Nolan", skins: ["Cosmic Wayfinder", "Navigator"] },
      { name: "Cici", skins: ["Whimsical Performer", "Tower Fun"] },
      { name: "Chip", skins: ["Phase Pauser", "Badabing"] },
      { name: "Zhuxin", skins: ["Lantern Keeper", "Empyrean Butterfly"] },
      { name: "Suyou", skins: ["Masked Immortal", "Nawa Blade"] },
      { name: "Lukas", skins: ["Beast Unleashed", "Wild Tempest"] },
      { name: "Zetian", skins: ["Empress of Fate", "Celestial Domain"] },
      { name: "Sora", skins: ["Blade of Thunder", "Stormrider"] },
      { name: "Marcel", skins: ["Sanctuary Keeper", "Harmonic Light"] },
      { name: "Obsidia", skins: ["Void Weaver", "Shadow Realm"] }
    ];

    function buildOfficialDatabase() {
      let catalog = [];
      let idCount = 1;

      OFFICIAL_MLBB_ROSTER.forEach(hero => {
        hero.skins.forEach(skinName => {
          let rarity = "Skin";
          if (skinName.includes("Collector")) rarity = "Collector";
          else if (skinName.includes("Legend") || skinName.includes("Storm") || skinName.includes("Obsidian") || skinName.includes("King of Hell")) rarity = "Legend";
          else if (skinName.includes("Lightborn") || skinName.includes("S.A.B.E.R.") || skinName.includes("V.E.N.O.M.") || skinName.includes("STUN") || skinName.includes("Atomic") || skinName.includes("Sparkle")) rarity = "Epic";
          else if (skinName.includes("Starlight") || skinName.includes("Cyber") || skinName.includes("Agent")) rarity = "Starlight";

          const formattedHero = encodeURIComponent(hero.name);
          const formattedSkin = encodeURIComponent(skinName.replace(/\s+/g, '_'));
          
          // Official Moonton asset CDN URL
          const imgUrl = `https://akmweb.ecdn.game.naver.com/mlbb/hero/skin/${formattedHero}_${formattedSkin}.jpg`;

          catalog.push({
            id: `sk_${idCount++}`,
            hero: hero.name,
            skin: skinName,
            rarity: rarity,
            img: imgUrl
          });
        });
      });

      fullSkinDatabase = catalog;
      selectedSkinList = fullSkinDatabase.slice(0, 16);
      document.getElementById('catalog-counter').textContent = `${fullSkinDatabase.length} Skins (${selectedSkinList.length} Selected)`;
      
      renderSkinLibrary();
      redrawCanvas();
    }

    function renderSkinLibrary() {
      const container = document.getElementById('library-render-area');
      const query = document.getElementById('search-input').value.toLowerCase();
      container.innerHTML = '';

      const filtered = fullSkinDatabase.filter(item => 
        item.hero.toLowerCase().includes(query) || 
        item.skin.toLowerCase().includes(query) ||
        item.rarity.toLowerCase().includes(query)
      );

      const gridDiv = document.createElement('div');
      gridDiv.className = 'grid grid-cols-4 gap-3 pt-1';

      filtered.forEach(skin => {
        const isSelected = selectedSkinList.some(s => s.id === skin.id);
        const tile = document.createElement('div');
        tile.className = 'flex flex-col items-center cursor-pointer group';
        tile.onclick = () => toggleSkinSelection(skin.id);

        tile.innerHTML = `
          <div class="relative w-14 h-14 rounded-full p-0.5 transition-all ${isSelected ? 'ring-2 ring-purple-500 bg-gradient-to-tr from-purple-500 to-amber-400' : 'border border-slate-700 opacity-80'}">
            <div class="w-full h-full rounded-full bg-slate-900 flex items-center justify-center font-bold text-xs text-purple-300 border border-slate-700 overflow-hidden">
              <img src="${skin.img}" class="w-full h-full object-cover" alt="${skin.hero}" loading="lazy" onerror="this.onerror=null; this.remove();">
              <span class="absolute">${skin.hero.substring(0, 2)}</span>
            </div>
            ${isSelected ? '<div class="absolute -top-1 -right-1 bg-purple-600 text-white rounded-full w-4 h-4 flex items-center justify-center text-[8px] border border-slate-900"><i class="fa-solid fa-check"></i></div>' : ''}
          </div>
          <span class="text-[9px] text-slate-300 font-medium mt-1 text-center truncate w-16">${skin.hero}</span>
          <span class="text-[8px] text-slate-500 text-center truncate w-16">${skin.skin}</span>
        `;
        gridDiv.appendChild(tile);
      });

      container.appendChild(gridDiv);
      document.getElementById('catalog-counter').textContent = `${fullSkinDatabase.length} Loaded (${selectedSkinList.length} Selected)`;
    }

    function toggleSkinSelection(skinId) {
      const item = fullSkinDatabase.find(s => s.id === skinId);
      if (!item) return;

      const idx = selectedSkinList.findIndex(s => s.id === skinId);
      if (idx >= 0) {
        selectedSkinList.splice(idx, 1);
      } else {
        selectedSkinList.push(item);
      }
      renderSkinLibrary();
      redrawCanvas();
    }

    function selectAllVisibleSkins() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const filtered = fullSkinDatabase.filter(item => 
        item.hero.toLowerCase().includes(query) || item.skin.toLowerCase().includes(query)
      );
      filtered.forEach(s => {
        if (!selectedSkinList.some(sel => sel.id === s.id)) selectedSkinList.push(s);
      });
      renderSkinLibrary();
      redrawCanvas();
    }

    function clearAllSelectedSkins() {
      selectedSkinList = [];
      renderSkinLibrary();
      redrawCanvas();
    }

    function updateLayoutConfig() {
      columns = Math.max(1, parseInt(document.getElementById('grid-cols').value) || 1);
      rows = Math.max(1, parseInt(document.getElementById('grid-rows').value) || 1);
      redrawCanvas();
    }

    function drawFallbackTile(ctx, x, y, tileSize, skin, isSelected) {
      // Create rich custom vector cards for MLBB hero tiles
      const grad = ctx.createLinearGradient(x, y, x + tileSize, y + tileSize);
      if (skin.rarity === 'Legend') {
        grad.addColorStop(0, '#4c1d95'); grad.addColorStop(1, '#be185d');
      } else if (skin.rarity === 'Collector') {
        grad.addColorStop(0, '#78350f'); grad.addColorStop(1, '#d97706');
      } else if (skin.rarity === 'Epic') {
        grad.addColorStop(0, '#1e1b4b'); grad.addColorStop(1, '#4338ca');
      } else {
        grad.addColorStop(0, '#0f172a'); grad.addColorStop(1, '#1e293b');
      }

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.roundRect(x, y, tileSize, tileSize, 8);
      ctx.fill();

      // Draw stylized hero initials & skin text
      ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
      ctx.font = "bold 28px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(skin.hero.substring(0, 2).toUpperCase(), x + tileSize/2, y + tileSize/2 + 6);

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 10px sans-serif";
      ctx.fillText(skin.hero, x + tileSize/2, y + tileSize/2 - 4);

      ctx.fillStyle = "#94a3b8";
      ctx.font = "8px sans-serif";
      ctx.fillText(skin.skin, x + tileSize/2, y + tileSize/2 + 10);
    }

    function redrawCanvas() {
      const tileSize = 90;
      const gap = 8;
      const headerHeight = uploadedProfileImage ? 160 : 0;

      exportCanvas.width = (columns * tileSize) + ((columns + 1) * gap);
      exportCanvas.height = headerHeight + (rows * tileSize) + ((rows + 1) * gap);

      ctx.fillStyle = "#090d16";
      ctx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);

      const b = document.getElementById('fx-b').value;
      const s = document.getElementById('fx-s').value;
      const c = document.getElementById('fx-c').value;
      const h = document.getElementById('fx-h').value;

      document.getElementById('val-b').textContent = b;
      document.getElementById('val-s').textContent = s;
      document.getElementById('val-c').textContent = c;
      document.getElementById('val-h').textContent = h;

      ctx.filter = `brightness(${b}%) saturate(${s}%) contrast(${c}%) hue-rotate(${h}deg)`;

      if (uploadedProfileImage) {
        ctx.drawImage(uploadedProfileImage, gap, gap, exportCanvas.width - (gap * 2), 144);
      }

      const totalTilesToRender = columns * rows;
      const skinsToDraw = selectedSkinList.slice(0, totalTilesToRender);

      for (let i = 0; i < totalTilesToRender; i++) {
        const col = i % columns;
        const row = Math.floor(i / columns);

        const x = gap + col * (tileSize + gap);
        const y = headerHeight + gap + row * (tileSize + gap);

        const skin = skinsToDraw[i];

        if (skin) {
          const isSelected = (i === activeSkinIndex);
          if (!tileOffsets[i]) tileOffsets[i] = { x: 0, y: 0 };
          const offset = tileOffsets[i];

          if (!imageCache[skin.img]) {
            drawFallbackTile(ctx, x, y, tileSize, skin, isSelected);

            const img = new Image();
            img.crossOrigin = "anonymous";
            img.src = skin.img;
            img.onload = () => {
              imageCache[skin.img] = img;
              redrawCanvas();
            };
            img.onerror = () => {
              imageCache[skin.img] = "ERROR";
            };
          } else if (imageCache[skin.img] === "ERROR") {
            drawFallbackTile(ctx, x, y, tileSize, skin, isSelected);
          } else {
            ctx.save();
            ctx.beginPath();
            ctx.roundRect(x, y, tileSize, tileSize, 8);
            ctx.clip();
            ctx.drawImage(imageCache[skin.img], x + offset.x, y + offset.y, tileSize, tileSize);
            ctx.restore();
          }

          // Tile selection highlight border
          ctx.strokeStyle = isSelected ? "#a855f7" : "#334155";
          ctx.lineWidth = isSelected ? 3 : 1;
          ctx.beginPath();
          ctx.roundRect(x, y, tileSize, tileSize, 8);
          ctx.stroke();

          // Rarity Tag
          ctx.fillStyle = skin.rarity === 'Legend' ? '#be185d' : skin.rarity === 'Collector' ? '#d97706' : '#6366f1';
          ctx.fillRect(x + tileSize - 42, y, 42, 12);
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 7px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(skin.rarity.toUpperCase(), x + tileSize - 21, y + 9);
        } else {
          // Empty grid slot
          ctx.fillStyle = "#141b2d";
          ctx.strokeStyle = "#1e293b";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.roundRect(x, y, tileSize, tileSize, 8);
          ctx.fill();
          ctx.stroke();
        }
      }

      ctx.filter = "none";
    }

    const screenshotInput = document.getElementById('user-screenshot-input');
    const screenshotPreview = document.getElementById('screenshot-preview');
    const uploadLabel = document.getElementById('upload-label');
    const deleteBtn = document.getElementById('delete-screenshot-btn');

    screenshotInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            uploadedProfileImage = img;
            screenshotPreview.src = event.target.result;
            screenshotPreview.classList.remove('hidden');
            uploadLabel.classList.add('hidden');
            deleteBtn.classList.remove('hidden');
            redrawCanvas();
          };
        };
        reader.readAsDataURL(file);
      }
    });

    function clearUploadedScreenshot() {
      screenshotInput.value = "";
      uploadedProfileImage = null;
      screenshotPreview.src = "";
      screenshotPreview.classList.add('hidden');
      uploadLabel.classList.remove('hidden');
      deleteBtn.classList.add('hidden');
      redrawCanvas();
    }

    function nudgeActiveTile(dx, dy) {
      if (!tileOffsets[activeSkinIndex]) tileOffsets[activeSkinIndex] = { x: 0, y: 0 };
      tileOffsets[activeSkinIndex].x += dx;
      tileOffsets[activeSkinIndex].y += dy;
      redrawCanvas();
    }

    exportCanvas.addEventListener('click', (e) => {
      const rect = exportCanvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      const tileSize = 90;
      const gap = 8;
      const headerHeight = uploadedProfileImage ? 160 : 0;

      const col = Math.floor((clickX - gap) / (tileSize + gap));
      const row = Math.floor((clickY - headerHeight - gap) / (tileSize + gap));

      if (col >= 0 && col < columns && row >= 0 && row < rows) {
        const idx = (row * columns) + col;
        if (idx < selectedSkinList.length) {
          activeSkinIndex = idx;
          redrawCanvas();
        }
      }
    });

    function executeCanvasDownload() {
      const format = document.getElementById('export-format').value;
      const scale = parseInt(document.getElementById('export-scale').value) || 2;

      const offCanvas = document.createElement('canvas');
      offCanvas.width = exportCanvas.width * scale;
      offCanvas.height = exportCanvas.height * scale;
      const offCtx = offCanvas.getContext('2d');

      offCtx.scale(scale, scale);
      offCtx.drawImage(exportCanvas, 0, 0);

      const mimeType = format === 'jpeg' ? 'image/jpeg' : 'image/png';
      const dataUrl = offCanvas.toDataURL(mimeType, 0.95);

      const downloadLink = document.createElement('a');
      downloadLink.download = `MLBB_Official_Collage_${Date.now()}.${format}`;
      downloadLink.href = dataUrl;
      downloadLink.click();
    }

    function switchTab(tabId) {
      document.querySelectorAll('#control-drawer > div').forEach(div => div.classList.add('hidden'));
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.replace('text-purple-400', 'text-slate-400'));
      
      document.getElementById(tabId).classList.remove('hidden');
      document.getElementById(`btn-${tabId}`).classList.replace('text-slate-400', 'text-purple-400');
    }

    function resetEffects() {
      document.getElementById('fx-b').value = 100;
      document.getElementById('fx-s').value = 100;
      document.getElementById('fx-c').value = 100;
      document.getElementById('fx-h').value = 0;
      redrawCanvas();
    }

    buildOfficialDatabase();
  </script>
