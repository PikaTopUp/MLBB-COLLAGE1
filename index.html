<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MLBB 1,133 Skin Showcase</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#090d16] text-slate-200 min-h-screen flex flex-col font-sans select-none pb-28">

  <!-- HEADER -->
  <header class="p-3 border-b border-slate-800 bg-[#0d121f] flex items-center justify-between sticky top-0 z-50">
    <div class="flex items-center gap-2">
      <i class="fa-solid fa-crown text-purple-400"></i>
      <h1 class="font-extrabold text-white text-sm">MLBB <span class="text-purple-400">1,133 Skins Tool</span></h1>
    </div>
    <button onclick="executeCanvasDownload()" class="px-3 py-1 bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs rounded-lg shadow transition">
      <i class="fa-solid fa-download mr-1"></i> Export
    </button>
  </header>

  <!-- MAIN CANVAS VIEW -->
  <main class="p-4 flex flex-col items-center justify-center">
    <div class="w-full max-w-sm bg-[#0e1320] border border-slate-800 rounded-xl p-3 shadow-2xl flex flex-col gap-3">
      
      <!-- PROFILE SCREENSHOT UPLOAD -->
      <div class="w-full h-32 bg-[#141b2d] rounded-lg border border-slate-700 relative overflow-hidden flex items-center justify-center">
        <label id="upload-label" class="w-full h-full flex flex-col items-center justify-center cursor-pointer p-2">
          <i class="fa-solid fa-cloud-arrow-up text-purple-400 text-xl mb-1"></i>
          <span class="text-xs font-semibold text-slate-300">Upload Profile Screenshot</span>
          <input type="file" id="user-screenshot-input" accept="image/*" class="hidden">
        </label>
        <img id="screenshot-preview" class="w-full h-full object-cover hidden" alt="Profile">
        <button id="delete-screenshot-btn" onclick="clearScreenshot()" class="hidden absolute top-2 right-2 bg-red-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs shadow"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <!-- CANVAS -->
      <div class="w-full flex justify-center overflow-auto">
        <canvas id="main-canvas" class="border border-slate-800 rounded-lg bg-[#090d16] max-w-full"></canvas>
      </div>
    </div>
  </main>

  <!-- SKIN SELECTOR DRAWER -->
  <section class="max-w-md mx-auto w-full px-4 mt-2 flex-1 flex flex-col gap-2">
    <div class="flex justify-between items-center bg-[#0d121f] p-2.5 rounded-xl border border-slate-800">
      <div class="flex items-center gap-2">
        <span class="text-xs font-bold text-white">Select Skins</span>
        <span id="counter-badge" class="bg-purple-900/50 text-purple-300 text-[10px] px-2 py-0.5 rounded-full border border-purple-500/30">0 Selected</span>
      </div>
      <div class="flex gap-2">
        <button onclick="selectAllSkins()" class="text-[10px] text-purple-400 font-semibold hover:underline">Select All</button>
        <button onclick="clearSkins()" class="text-[10px] text-red-400 font-semibold hover:underline">Clear</button>
      </div>
    </div>

    <!-- SEARCH -->
    <div class="relative">
      <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-500 text-xs"></i>
      <input type="text" id="search-box" oninput="renderLibrary()" placeholder="Search from 1,133 skins..." class="w-full bg-[#0d121f] border border-slate-800 rounded-xl pl-8 pr-3 py-2 text-xs text-white focus:outline-none focus:border-purple-500">
    </div>

    <!-- GRID LIBRARY -->
    <div id="skin-grid" class="grid grid-cols-3 gap-2 max-h-72 overflow-y-auto p-1 bg-[#0d121f]/50 rounded-xl border border-slate-800"></div>
  </section>

  <script>
    const HEROES = [
      "Miya", "Balmond", "Saber", "Alice", "Nana", "Tigreal", "Alucard", "Karina", 
      "Akai", "Franco", "Bane", "Bruno", "Clint", "Haya", "Rafaela", "Eudora", 
      "Zilong", "Fanny", "Layla", "Minotaur", "Lolita", "Zask", "Helcurt", "Pharsa", 
      "Lesley", "Jawhead", "Angela", "Gusion", "Valir", "Martis", "Uranus", "Hanabi", 
      "Chang'e", "Kaja", "Selena", "Claude", "Belerick", "Kimmy", "Harith", "Minsitthar", 
      "Badang", "Khufra", "Granger", "Guinevere", "Esmeralda", "Terizla", "X.Borg", 
      "Dyrroth", "Lylia", "Ling", "Baxia", "Masha", "Wanwan", "Silvanna", "Cecilion", 
      "Carmilla", "Atlas", "Popol & Kupa", "Yu Zhong", "Luo Yi", "Benedetta", "Khaleed", 
      "Barats", "Brody", "Yve", "Mathilda", "Gatotkaca", "Grock", "Irithel", "Sun", 
      "Odette", "Vexana", "Argus", "Lapu-Lapu", "Estes", "Hilda", "Aurora", "Johnson", 
      "Freya", "Moskov", "Cyclops", "Yi Sun-shin", "Aura", "Valentina", "Edith", "Floryn", 
      "Aamon", "Melissa", "Xavier", "Julian", "Fredrinn", "Joy", "Novaria", 
      "Arlott", "Ixia", "Nolan", "Cici", "Chip", "Zhuxin", "Suyou", "Lukas"
    ];

    const TIERS = [
      { name: "Legend", pts: 3000, color: "#ea580c" },
      { name: "Collector", pts: 3000, color: "#d97706" },
      { name: "Epic", pts: 2000, color: "#db2777" },
      { name: "Starlight", pts: 1000, color: "#2563eb" },
      { name: "Special", pts: 500, color: "#059669" },
      { name: "Elite", pts: 200, color: "#b45309" },
      { name: "Basic", pts: 100, color: "#475569" }
    ];

    let allSkins = [];
    let selectedIds = new Set();
    let profileImage = null;

    // Generate exact 1,133 skins instantly without lag
    function initDatabase() {
      let id = 1;
      while(allSkins.length < 1133) {
        for(let i = 0; i < HEROES.length; i++) {
          if(allSkins.length >= 1133) break;
          const hero = HEROES[i];
          const tier = TIERS[(allSkins.length + i) % TIERS.length];
          const v = Math.floor(allSkins.length / HEROES.length) + 1;
          allSkins.push({
            id: id++,
            hero: hero,
            skinName: v === 1 ? tier.name : `${tier.name} V${v}`,
            pts: tier.pts,
            color: tier.color
          });
        }
      }
      // Default select first 12 skins
      for(let i = 0; i < 12; i++) selectedIds.add(allSkins[i].id);
      renderLibrary();
      redrawCanvas();
    }

    function renderLibrary() {
      const grid = document.getElementById('skin-grid');
      const query = document.getElementById('search-box').value.toLowerCase();
      grid.innerHTML = '';

      const filtered = allSkins.filter(s => s.hero.toLowerCase().includes(query) || s.skinName.toLowerCase().includes(query));
      
      filtered.slice(0, 100).forEach(skin => {
        const isSelected = selectedIds.has(skin.id);
        const card = document.createElement('div');
        card.className = `flex flex-col items-center p-2 rounded-lg cursor-pointer border transition ${isSelected ? 'bg-purple-950/40 border-purple-500' : 'bg-[#141b2d] border-slate-800'}`;
        card.onclick = () => {
          if(isSelected) selectedIds.delete(skin.id);
          else selectedIds.add(skin.id);
          renderLibrary();
          redrawCanvas();
        };

        card.innerHTML = `
          <div class="w-12 h-12 rounded bg-slate-900 border border-slate-700 flex flex-col items-center justify-center p-1 relative" style="border-top: 3px solid ${skin.color}">
            <span class="text-[9px] font-bold text-white truncate w-full text-center">${skin.hero}</span>
            <span class="text-[7px] text-purple-300">${skin.pts}p</span>
            ${isSelected ? '<div class="absolute top-0.5 right-0.5 bg-purple-600 text-white rounded-full w-3 h-3 flex items-center justify-center text-[7px]">✓</div>' : ''}
          </div>
          <span class="text-[9px] text-slate-300 mt-1 truncate w-full text-center">${skin.hero}</span>
        `;
        grid.appendChild(card);
      });

      document.getElementById('counter-badge').textContent = `${selectedIds.size} Selected`;
    }

    function selectAllAll() {
      const query = document.getElementById('search-box').value.toLowerCase();
      allSkins.filter(s => s.hero.toLowerCase().includes(query) || s.skinName.toLowerCase().includes(query))
              .forEach(s => selectedIds.add(s.id));
      renderLibrary();
      redrawCanvas();
    }

    function clearSkins() {
      selectedIds.clear();
      renderLibrary();
      redrawCanvas();
    }

    const canvas = document.getElementById('main-canvas');
    const ctx = canvas.getContext('2d');

    function redrawCanvas() {
      const tileSize = 85;
      const gap = 6;
      const cols = 4;
      const headerH = profileImage ? 130 : 0;
      const list = allSkins.filter(s => selectedIds.has(s.id));

      if(list.length === 0) {
        canvas.width = 360;
        canvas.height = 150;
        ctx.fillStyle = "#090d16";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#64748b";
        ctx.font = "12px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("Select skins below to generate view", canvas.width/2, canvas.height/2);
        return;
      }

      const rows = Math.ceil(list.length / cols);
      canvas.width = (cols * tileSize) + ((cols + 1) * gap);
      canvas.height = headerH + (rows * tileSize) + ((rows + 1) * gap);

      ctx.fillStyle = "#090d16";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if(profileImage) {
        ctx.drawImage(profileImage, gap, gap, canvas.width - (gap * 2), 115);
      }

      list.forEach((skin, i) => {
        const c = i % cols;
        const r = Math.floor(i / cols);
        const x = gap + c * (tileSize + gap);
        const y = headerH + gap + r * (tileSize + gap);

        // Card Background
        ctx.fillStyle = "#141b2d";
        ctx.beginPath();
        ctx.roundRect(x, y, tileSize, tileSize, 8);
        ctx.fill();
        ctx.strokeStyle = skin.color;
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Hero Name
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 11px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(skin.hero, x + (tileSize/2), y + 32);

        // Skin Tier
        ctx.fillStyle = "#94a3b8";
        ctx.font = "9px sans-serif";
        ctx.fillText(skin.skinName, x + (tileSize/2), y + 46);

        // Points Tag
        ctx.fillStyle = "rgba(15, 23, 42, 0.9)";
        ctx.roundRect(x + 10, y + 58, tileSize - 20, 18, 4);
        ctx.fill();
        ctx.fillStyle = "#c084fc";
        ctx.font = "bold 9px sans-serif";
        ctx.fillText(`${skin.pts} Pts`, x + (tileSize/2), y + 71);
      });
    }

    // Image Upload Handling
    const uploadInput = document.getElementById('user-screenshot-input');
    uploadInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if(file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            profileImage = img;
            document.getElementById('screenshot-preview').src = event.target.result;
            document.getElementById('screenshot-preview').classList.remove('hidden');
            document.getElementById('upload-label').classList.add('hidden');
            document.getElementById('delete-screenshot-btn').classList.remove('hidden');
            redrawCanvas();
          };
        };
        reader.readAsDataURL(file);
      }
    });

    function clearScreenshot() {
      profileImage = null;
      uploadInput.value = "";
      document.getElementById('screenshot-preview').classList.add('hidden');
      document.getElementById('upload-label').classList.remove('hidden');
      document.getElementById('delete-screenshot-btn').classList.add('hidden');
      redrawCanvas();
    }

    function executeCanvasDownload() {
      const link = document.createElement('a');
      link.download = `MLBB_1133_Skins_${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png', 1.0);
      link.click();
    }

    initDatabase();
  </script>
</body>
</html>
