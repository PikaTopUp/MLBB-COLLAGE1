<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MLBB Showcase Collage</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .selected-tile { ring: 2px solid #a855f7; border-color: #a855f7 !important; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#090d16] text-slate-200 min-h-screen flex flex-col font-sans select-none pb-28">

  <!-- TOP BAR -->
  <header class="p-3 border-b border-slate-800 bg-[#0d121f] flex items-center justify-between">
    <div class="flex items-center gap-2">
      <i class="fa-solid fa-crown text-purple-400"></i>
      <h1 class="font-extrabold text-white text-sm">MLBB <span class="text-purple-400">Collage</span></h1>
    </div>
    <div class="flex items-center gap-1 bg-[#131a29] p-1 rounded-lg border border-slate-800">
      <span class="text-[10px] text-slate-400 px-1">Nudge:</span>
      <button onclick="moveSelectedSkin('up')" class="w-6 h-6 bg-slate-800 hover:bg-slate-700 rounded text-xs text-white"><i class="fa-solid fa-arrow-up"></i></button>
      <button onclick="moveSelectedSkin('down')" class="w-6 h-6 bg-slate-800 hover:bg-slate-700 rounded text-xs text-white"><i class="fa-solid fa-arrow-down"></i></button>
      <button onclick="moveSelectedSkin('left')" class="w-6 h-6 bg-slate-800 hover:bg-slate-700 rounded text-xs text-white"><i class="fa-solid fa-arrow-left"></i></button>
      <button onclick="moveSelectedSkin('right')" class="w-6 h-6 bg-slate-800 hover:bg-slate-700 rounded text-xs text-white"><i class="fa-solid fa-arrow-right"></i></button>
    </div>
  </header>

  <!-- CANVAS DISPLAY -->
  <main class="flex-1 p-3 flex flex-col items-center justify-start overflow-x-auto">
    <div id="collage-canvas" class="w-full max-w-sm bg-[#0e1320] border border-slate-800 rounded-xl p-2 shadow-2xl flex flex-col gap-2 transition-all">
      <div id="screenshot-container" class="w-full min-h-[140px] bg-[#141b2d] rounded-lg border border-slate-800 flex items-center justify-center relative overflow-hidden">
        <label class="w-full h-full flex flex-col items-center justify-center cursor-pointer p-4">
          <i class="fa-solid fa-cloud-arrow-up text-purple-400 text-xl mb-1"></i>
          <p id="screenshot-placeholder" class="text-[11px] text-slate-400 text-center font-medium">Upload Account Screenshot<br><span class="text-[9px] text-slate-500">PNG, JPG up to 5MB</span></p>
          <input type="file" id="screenshot-upload" accept="image/*" class="hidden">
        </label>
        <img id="screenshot-img" class="absolute inset-0 w-full h-full object-cover hidden" alt="Screenshot">
      </div>

      <div id="skins-grid" class="grid gap-1 bg-[#090d16] p-1 rounded-lg border border-slate-800/60 min-h-[150px]">
        <!-- Dynamic Selected Canvas Tiles -->
      </div>
    </div>
  </main>

  <!-- CONTROL DRAWER -->
  <div id="control-drawer" class="fixed bottom-14 inset-x-0 bg-[#0d121f] border-t border-slate-800 p-3 max-w-md mx-auto rounded-t-2xl shadow-2xl max-h-96 overflow-y-auto transition-all">
    
    <!-- TAB 1: SKINS SELECTOR -->
    <div id="tab-skins" class="space-y-3">
      <div class="flex justify-between items-center border-b border-slate-800 pb-2">
        <div class="flex items-center gap-2">
          <span class="text-xs font-bold text-white">Skin Library</span>
          <span id="library-count-badge" class="bg-purple-900/40 text-purple-300 text-[10px] px-2 py-0.5 rounded-full border border-purple-500/30">Loading database...</span>
        </div>
        <button id="clear-all-btn" class="text-[11px] text-red-400 hover:text-red-300 font-semibold"><i class="fa-solid fa-xmark mr-1"></i>Clear</button>
      </div>

      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-500 text-xs"></i>
        <input type="text" id="skin-search-input" placeholder="Search hero or skin name (e.g. Chou, Lunar Fest, ALLSTAR)..." class="w-full bg-[#151b2a] border border-slate-700/80 rounded-lg pl-8 pr-3 py-1.5 text-xs text-white focus:outline-none focus:border-purple-500">
      </div>
      
      <div id="categories-container" class="space-y-4 pt-1">
        <!-- Rendered dynamically -->
      </div>
    </div>

    <!-- TAB 2: LAYOUT -->
    <div id="tab-layout" class="hidden space-y-3">
      <h3 class="text-xs font-bold text-white border-b border-slate-800 pb-1.5">Grid Layout</h3>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-[10px] text-slate-400 block mb-1">Columns</label>
          <input type="number" id="cols-input" value="4" min="1" max="10" class="w-full bg-[#151b2a] border border-slate-700 rounded p-1.5 text-xs text-center font-bold text-white">
        </div>
        <div>
          <label class="text-[10px] text-slate-400 block mb-1">Rows</label>
          <input type="number" id="rows-input" value="4" min="1" max="20" class="w-full bg-[#151b2a] border border-slate-700 rounded p-1.5 text-xs text-center font-bold text-white">
        </div>
      </div>
    </div>

    <!-- TAB 3: EFFECTS -->
    <div id="tab-effects" class="hidden space-y-3">
      <div class="flex justify-between items-center border-b border-slate-800 pb-1.5">
        <h3 class="text-xs font-bold text-white">Visual Effects</h3>
        <button id="reset-effects-btn" class="text-[10px] text-purple-400 hover:text-purple-300">Reset Effects</button>
      </div>
      <div class="grid grid-cols-2 gap-2.5 text-[10px] text-slate-400">
        <div>
          <label class="block mb-1">Brightness</label>
          <input type="range" id="effect-brightness" min="50" max="150" value="100" class="w-full accent-purple-500">
        </div>
        <div>
          <label class="block mb-1">Saturation</label>
          <input type="range" id="effect-saturate" min="0" max="200" value="100" class="w-full accent-purple-500">
        </div>
        <div>
          <label class="block mb-1">Contrast</label>
          <input type="range" id="effect-contrast" min="50" max="150" value="100" class="w-full accent-purple-500">
        </div>
        <div>
          <label class="block mb-1">Hue Rotate</label>
          <input type="range" id="effect-hue" min="0" max="360" value="0" class="w-full accent-purple-500">
        </div>
      </div>
    </div>

    <!-- TAB 4: EXPORT -->
    <div id="tab-export" class="hidden space-y-3">
      <h3 class="text-xs font-bold text-white border-b border-slate-800 pb-1.5">Export Options</h3>
      <div class="grid grid-cols-2 gap-2 text-[10px]">
        <div>
          <label class="text-slate-400 block mb-1 font-semibold">Format</label>
          <select id="export-format" class="w-full bg-[#151b2a] border border-slate-700 rounded p-1.5 text-xs text-white focus:outline-none">
            <option value="png">PNG (High Quality)</option>
            <option value="jpeg">JPG (Compressed)</option>
            <option value="webp">WEBP (Modern)</option>
          </select>
        </div>
        <div>
          <label class="text-slate-400 block mb-1 font-semibold">Resolution</label>
          <select id="export-quality" class="w-full bg-[#151b2a] border border-slate-700 rounded p-1.5 text-xs text-white focus:outline-none">
            <option value="1">1x Standard</option>
            <option value="2" selected>2x High Def</option>
            <option value="4">4x Ultra HD 4K</option>
          </select>
        </div>
      </div>
      <button id="download-btn" class="w-full py-2.5 bg-purple-600 hover:bg-purple-500 text-white font-extrabold text-xs rounded-lg shadow-lg transition mt-2">
        DOWNLOAD COLLAGE
      </button>
    </div>

  </div>

  <!-- NAVIGATION BAR -->
  <nav class="fixed bottom-0 inset-x-0 bg-[#0a0e17] border-t border-slate-800 px-4 py-2 flex justify-around items-center z-50">
    <button data-tab="tab-skins" class="nav-btn text-purple-400 flex flex-col items-center gap-1 text-[10px] font-semibold">
      <i class="fa-solid fa-layer-group text-sm"></i>
      <span>Skins</span>
    </button>
    <button data-tab="tab-layout" class="nav-btn text-slate-400 flex flex-col items-center gap-1 text-[10px] font-semibold">
      <i class="fa-solid fa-border-all text-sm"></i>
      <span>Layout</span>
    </button>
    <button data-tab="tab-effects" class="nav-btn text-slate-400 flex flex-col items-center gap-1 text-[10px] font-semibold">
      <i class="fa-solid fa-wand-magic-sparkles text-sm"></i>
      <span>Effects</span>
    </button>
    <button data-tab="tab-export" class="nav-btn text-slate-400 flex flex-col items-center gap-1 text-[10px] font-semibold">
      <i class="fa-solid fa-download text-sm"></i>
      <span>Export</span>
    </button>
  </nav>

  <script>
    let fullSkinCatalog = [];
    let skinCategories = [];
    let selectedSkins = [];
    let activeTileIndex = 0;
    let skinOffsets = {};
    let columns = 4;
    let rows = 4;

    // Drawer state tracking
    let currentActiveTab = 'tab-skins';
    let isDrawerOpen = true;

    const gridEl = document.getElementById('skins-grid');
    const categoriesContainer = document.getElementById('categories-container');
    const drawerEl = document.getElementById('control-drawer');

    function getProxiedImage(url) {
      if (!url) return 'https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=150&auto=format&fit=crop&q=80';
      return `https://images.weserv.nl/?url=${encodeURIComponent(url)}&w=250&output=jpg`;
    }

    const builtIn2026Skins = [
      { id: "e1", hero: "Chou", skin: "Lunar Fest - Fortune Dragon", rarity: "Lunar Fest", img: "https://images.weserv.nl/?url=https://static.wikia.nocookie.net/mobile-legends/images/9/90/Dragon_Boy.jpg" },
      { id: "e2", hero: "Melissa", skin: "ALLSTAR Sparkle", rarity: "ALLSTAR", img: "https://images.weserv.nl/?url=https://static.wikia.nocookie.net/mobile-legends/images/8/87/Pixel_Blast.jpg" },
      { id: "e3", hero: "Esmeralda", skin: "Lunar Fest - Astral Maiden", rarity: "Lunar Fest", img: "https://images.weserv.nl/?url=https://static.wikia.nocookie.net/mobile-legends/images/3/36/Psion_of_Tomorrow.jpg" },
      { id: "e4", hero: "Estes", skin: "ALLSTAR Rhythm", rarity: "ALLSTAR", img: "https://images.weserv.nl/?url=https://static.wikia.nocookie.net/mobile-legends/images/4/4b/Conqueror.jpg" },
      { id: "e5", hero: "Alpha", skin: "Revenant", rarity: "Legend", img: "https://images.weserv.nl/?url=https://static.wikia.nocookie.net/mobile-legends/images/c/c3/Revenant.jpg" },
      { id: "e6", hero: "Alucard", skin: "Obsidian Blade", rarity: "Legend", img: "https://images.weserv.nl/?url=https://static.wikia.nocookie.net/mobile-legends/images/0/07/Obsidian_Blade.jpg" },
      { id: "e7", hero: "Fanny", skin: "Skylark", rarity: "Legend", img: "https://images.weserv.nl/?url=https://static.wikia.nocookie.net/mobile-legends/images/2/22/Skylark.jpg" },
      { id: "e8", hero: "Franco", skin: "King of Hell", rarity: "Legend", img: "https://images.weserv.nl/?url=https://static.wikia.nocookie.net/mobile-legends/images/9/91/King_of_Hell.jpg" }
    ];

    async function loadFandomWikiSkins() {
      const badge = document.getElementById('library-count-badge');
      badge.textContent = "Loading catalog...";

      try {
        const catTarget = "Category:Hero_skins";
        const wikiApiUrl = `https://mobile-legends.fandom.com/api.php?action=query&list=categorymembers&cmtitle=${catTarget}&cmlimit=500&cmtype=page&format=json&origin=*`;
        
        const res = await fetch(wikiApiUrl);
        const data = await res.json();
        let pages = [];

        if (data.query && data.query.categorymembers) {
          pages = data.query.categorymembers.filter(p => p.ns === 0);
        }

        const pageIds = pages.map(p => p.pageid);
        const chunkedIds = [];
        for (let i = 0; i < pageIds.length; i += 50) {
          chunkedIds.push(pageIds.slice(i, i + 50));
        }

        let fetchedSkins = [...builtIn2026Skins];

        for (const ids of chunkedIds) {
          const imgApiUrl = `https://mobile-legends.fandom.com/api.php?action=query&pageids=${ids.join('|')}&prop=pageimages&pithumbsize=250&format=json&origin=*`;
          const imgRes = await fetch(imgApiUrl);
          const imgData = await imgRes.json();

          if (imgData.query && imgData.query.pages) {
            Object.values(imgData.query.pages).forEach(page => {
              const fullTitle = page.title;
              const titleParts = fullTitle.split('/');
              const heroName = titleParts[0].trim();
              const skinName = titleParts[1] ? titleParts[1].trim() : heroName;

              let rarity = "Skin";
              if (fullTitle.includes("Legend")) rarity = "Legend";
              else if (fullTitle.includes("Collector")) rarity = "Collector";
              else if (fullTitle.includes("Epic")) rarity = "Epic";
              else if (fullTitle.includes("Special")) rarity = "Special";

              const imgUrl = page.thumbnail ? page.thumbnail.source : null;

              if (imgUrl) {
                fetchedSkins.push({
                  id: `wiki_${page.pageid}`,
                  hero: heroName,
                  skin: skinName,
                  rarity: rarity,
                  img: getProxiedImage(imgUrl)
                });
              }
            });
          }
        }

        fullSkinCatalog = fetchedSkins;

      } catch (err) {
        console.error("Fandom API failed, loading built-in catalog:", err);
        fullSkinCatalog = builtIn2026Skins;
      }

      const catMap = {};
      fullSkinCatalog.forEach(skin => {
        const cat = skin.rarity.includes("ALLSTAR") ? "2026 ALLSTAR Skins" :
                   skin.rarity.includes("Lunar") ? "2026 Lunar Fest Skins" :
                   skin.rarity.includes("Legend") ? "Legend Skins" : 
                   skin.rarity.includes("Collector") ? "Collector Skins" : "All MLBB Skins";
        if (!catMap[cat]) catMap[cat] = [];
        catMap[cat].push(skin);
      });

      skinCategories = Object.keys(catMap).map(c => ({ category: c, skins: catMap[c] }));
      selectedSkins = fullSkinCatalog.slice(0, 16);
      renderCategoryLibrary();
      renderGrid();
    }

    function renderCategoryLibrary() {
      categoriesContainer.innerHTML = '';
      const searchQuery = document.getElementById('skin-search-input').value.toLowerCase();

      skinCategories.forEach(cat => {
        const filteredSkins = cat.skins.filter(s => 
          s.hero.toLowerCase().includes(searchQuery) || 
          s.skin.toLowerCase().includes(searchQuery)
        );

        if (filteredSkins.length === 0) return;

        const displaySkins = searchQuery ? filteredSkins : filteredSkins.slice(0, 24);
        const catSelectedCount = filteredSkins.filter(s => selectedSkins.some(sel => sel.id === s.id)).length;
        const allSelected = catSelectedCount === filteredSkins.length && filteredSkins.length > 0;

        const catSection = document.createElement('div');
        catSection.className = 'space-y-2';

        catSection.innerHTML = `
          <div class="flex items-center justify-between">
            <h4 class="text-xs font-bold text-slate-200 flex items-center gap-1.5">
              <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
              ${cat.category}
            </h4>
            <div class="flex items-center gap-2">
              <span class="text-[10px] text-slate-400 font-semibold">${catSelectedCount}/${filteredSkins.length}</span>
              <button onclick="toggleCategory('${cat.category}')" class="w-5 h-5 rounded-full flex items-center justify-center ${allSelected ? 'bg-purple-600 text-white' : 'border border-slate-700 text-transparent'}">
                <i class="fa-solid fa-check text-[10px]"></i>
              </button>
            </div>
          </div>
          <div class="grid grid-cols-4 gap-3 pt-1">
            ${displaySkins.map(skin => {
              const isSelected = selectedSkins.some(s => s.id === skin.id);
              return `
                <div onclick="toggleSkin('${skin.id}')" class="flex flex-col items-center cursor-pointer group">
                  <div class="relative w-14 h-14 rounded-full p-0.5 transition-all ${isSelected ? 'ring-2 ring-purple-500 bg-gradient-to-tr from-purple-500 to-amber-400' : 'border border-slate-700 opacity-80'}">
                    <img src="${skin.img}" class="w-full h-full object-cover rounded-full bg-slate-900" alt="${skin.hero}" loading="lazy">
                    ${isSelected ? '<div class="absolute -top-1 -right-1 bg-purple-600 text-white rounded-full w-4 h-4 flex items-center justify-center text-[8px] border border-slate-900"><i class="fa-solid fa-check"></i></div>' : ''}
                  </div>
                  <span class="text-[9px] text-slate-300 font-medium mt-1 text-center truncate w-16">${skin.hero}</span>
                  <span class="text-[8px] text-slate-500 text-center truncate w-16">${skin.skin}</span>
                </div>
              `;
            }).join('')}
          </div>
        `;
        categoriesContainer.appendChild(catSection);
      });

      document.getElementById('library-count-badge').textContent = `${fullSkinCatalog.length} Skins Loaded (${selectedSkins.length} Selected)`;
    }

    function toggleSkin(skinId) {
      const targetSkin = fullSkinCatalog.find(s => s.id === skinId);
      if (!targetSkin) return;

      const exists = selectedSkins.some(s => s.id === skinId);
      if (exists) {
        selectedSkins = selectedSkins.filter(s => s.id !== skinId);
      } else {
        selectedSkins.push(targetSkin);
      }
      renderCategoryLibrary();
      renderGrid();
    }

    function toggleCategory(catName) {
      const cat = skinCategories.find(c => c.category === catName);
      if (!cat) return;

      const allSelected = cat.skins.every(s => selectedSkins.some(sel => sel.id === s.id));
      if (allSelected) {
        selectedSkins = selectedSkins.filter(s => !cat.skins.some(cs => cs.id === s.id));
      } else {
        cat.skins.forEach(s => {
          if (!selectedSkins.some(sel => sel.id === s.id)) selectedSkins.push(s);
        });
      }
      renderCategoryLibrary();
      renderGrid();
    }

    function renderGrid() {
      if (!gridEl) return;
      gridEl.style.gridTemplateColumns = `repeat(${columns}, minmax(0, 1fr))`;
      gridEl.innerHTML = '';

      selectedSkins.forEach((skin, index) => {
        if (!skinOffsets[index]) skinOffsets[index] = { x: 0, y: 0 };
        const offset = skinOffsets[index];

        const tile = document.createElement('div');
        tile.className = `relative aspect-[3/4] bg-slate-800 rounded-lg overflow-hidden border border-slate-700/80 cursor-pointer ${index === activeTileIndex ? 'selected-tile' : ''}`;
        tile.onclick = () => { activeTileIndex = index; renderGrid(); };

        tile.innerHTML = `
          <img src="${skin.img}" class="w-full h-full object-cover transition-transform" style="transform: translate(${offset.x}px, ${offset.y}px);" loading="lazy">
          <div class="absolute top-0 right-0 bg-amber-500 text-[6px] text-black font-extrabold px-1 rounded-bl">${skin.rarity}</div>
          <div class="absolute bottom-0 inset-x-0 bg-gradient-to-t from-black/90 to-transparent p-1">
            <p class="text-[7px] font-bold text-white leading-none truncate">${skin.hero}</p>
          </div>
        `;
        gridEl.appendChild(tile);
      });
    }

    function moveSelectedSkin(direction) {
      if (!skinOffsets[activeTileIndex]) skinOffsets[activeTileIndex] = { x: 0, y: 0 };
      const step = 4;
      if (direction === 'up') skinOffsets[activeTileIndex].y -= step;
      if (direction === 'down') skinOffsets[activeTileIndex].y += step;
      if (direction === 'left') skinOffsets[activeTileIndex].x -= step;
      if (direction === 'right') skinOffsets[activeTileIndex].x += step;
      renderGrid();
    }

    document.getElementById('skin-search-input').addEventListener('input', renderCategoryLibrary);
    document.getElementById('clear-all-btn').addEventListener('click', () => {
      selectedSkins = [];
      renderCategoryLibrary();
      renderGrid();
    });

    document.getElementById('cols-input').addEventListener('input', (e) => { columns = parseInt(e.target.value) || 1; renderGrid(); });
    document.getElementById('rows-input').addEventListener('input', (e) => { rows = parseInt(e.target.value) || 1; renderGrid(); });

    // TOGGLE DRAWER ON NAV BUTTON CLICK
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const targetTab = btn.dataset.tab;

        if (currentActiveTab === targetTab && isDrawerOpen) {
          // If tapping the already-active tab while open, CLOSE the drawer
          drawerEl.classList.add('hidden');
          isDrawerOpen = false;
          btn.classList.replace('text-purple-400', 'text-slate-400');
        } else {
          // OPEN the drawer and switch to clicked tab
          drawerEl.classList.remove('hidden');
          isDrawerOpen = true;

          // Highlight current active button
          document.querySelectorAll('.nav-btn').forEach(b => b.classList.replace('text-purple-400', 'text-slate-400'));
          btn.classList.replace('text-slate-400', 'text-purple-400');

          // Switch active tab view inside drawer
          document.querySelectorAll('#control-drawer > div').forEach(div => div.classList.add('hidden'));
          document.getElementById(targetTab).classList.remove('hidden');

          currentActiveTab = targetTab;
        }
      });
    });

    document.getElementById('screenshot-upload').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          document.getElementById('screenshot-placeholder').classList.add('hidden');
          const img = document.getElementById('screenshot-img');
          img.src = evt.target.result;
          img.classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      }
    });

    document.getElementById('download-btn').addEventListener('click', () => {
      const node = document.getElementById('collage-canvas');
      const format = document.getElementById('export-format').value;
      const pixelRatio = parseInt(document.getElementById('export-quality').value) || 2;

      htmlToImage.toPng(node, { pixelRatio: pixelRatio, cacheBust: true })
        .then(dataUrl => {
          const a = document.createElement('a');
          a.download = `MLBB_Collage.${format}`;
          a.href = dataUrl;
          a.click();
        });
    });

    loadFandomWikiSkins();
  </script>
</body>
</html>
