<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MLBB Complete Skin Showcase (1,133 Skins)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#090d16] text-slate-200 min-h-screen flex flex-col font-sans select-none pb-36">

  <!-- HEADER -->
  <header class="p-3 border-b border-slate-800 bg-[#0d121f] flex items-center justify-between">
    <div class="flex items-center gap-2">
      <i class="fa-solid fa-crown text-purple-400"></i>
      <h1 class="font-extrabold text-white text-sm">MLBB <span class="text-purple-400">1,133 Skins Manager</span></h1>
    </div>
    <div class="flex items-center gap-1 bg-[#131a29] p-1 rounded-lg border border-slate-800">
      <span class="text-[10px] text-slate-400 px-1">Nudge:</span>
      <button onclick="nudgeActiveTile(0, -10)" class="w-6 h-6 bg-slate-800 hover:bg-slate-700 rounded text-xs text-white"><i class="fa-solid fa-arrow-up"></i></button>
      <button onclick="nudgeActiveTile(0, 10)" class="w-6 h-6 bg-slate-800 hover:bg-slate-700 rounded text-xs text-white"><i class="fa-solid fa-arrow-down"></i></button>
      <button onclick="nudgeActiveTile(-10, 0)" class="w-6 h-6 bg-slate-800 hover:bg-slate-700 rounded text-xs text-white"><i class="fa-solid fa-arrow-left"></i></button>
      <button onclick="nudgeActiveTile(10, 0)" class="w-6 h-6 bg-slate-800 hover:bg-slate-700 rounded text-xs text-white"><i class="fa-solid fa-arrow-right"></i></button>
    </div>
  </header>

  <!-- DISPLAY MAIN CANVAS -->
  <main class="flex-1 p-3 flex flex-col items-center justify-start overflow-x-auto">
    <div class="w-full max-w-sm bg-[#0e1320] border border-slate-800 rounded-xl p-2 shadow-2xl flex flex-col gap-2">
      
      <!-- SCREENSHOT UPLOAD HEADER LAYER -->
      <div id="screenshot-wrapper" class="w-full h-36 bg-[#141b2d] rounded-lg border border-slate-800 relative overflow-hidden flex items-center justify-center">
        <label id="upload-label" class="w-full h-full flex flex-col items-center justify-center cursor-pointer p-4">
          <i class="fa-solid fa-cloud-arrow-up text-purple-400 text-2xl mb-1"></i>
          <span class="text-xs font-semibold text-slate-300">Upload Profile Screenshot</span>
          <span class="text-[9px] text-slate-500">PNG or JPG up to 10MB</span>
          <input type="file" id="user-screenshot-input" accept="image/*" class="hidden">
        </label>
        
        <img id="screenshot-preview" class="w-full h-full object-cover hidden" alt="Profile Screenshot">
        
        <button id="delete-screenshot-btn" onclick="clearUploadedScreenshot()" class="hidden absolute top-2 right-2 bg-red-600/90 hover:bg-red-600 text-white w-7 h-7 rounded-full flex items-center justify-center text-xs shadow-lg z-10 transition">
          <i class="fa-solid fa-trash-can"></i>
        </button>
      </div>

      <!-- CANVAS ENGINE -->
      <div class="relative w-full flex justify-center overflow-auto">
        <canvas id="main-export-canvas" class="border border-slate-800/80 rounded-lg bg-[#090d16] shadow-inner cursor-pointer max-w-full"></canvas>
      </div>
    </div>
  </main>

  <!-- CONTROL DRAWER -->
  <div id="control-drawer" class="fixed bottom-14 inset-x-0 bg-[#0d121f] border-t border-slate-800 p-3 max-w-md mx-auto rounded-t-2xl shadow-2xl max-h-96 overflow-y-auto z-40">
    
    <!-- SKINS LIBRARY SELECTION -->
    <div id="tab-skins" class="space-y-3 control-tab-content">
      <div class="flex justify-between items-center border-b border-slate-800 pb-2">
        <div class="flex items-center gap-2">
          <span class="text-xs font-bold text-white">Full Skin Library</span>
          <span id="catalog-counter" class="bg-purple-900/40 text-purple-300 text-[10px] px-2 py-0.5 rounded-full border border-purple-500/30">1,133 Loaded</span>
        </div>
        <div class="flex gap-2">
          <button onclick="selectAllVisibleSkins()" class="text-[10px] text-purple-400 hover:text-purple-300 font-semibold">Select Filtered</button>
          <button onclick="clearAllSelectedSkins()" class="text-[10px] text-red-400 hover:text-red-300 font-semibold">Clear</button>
        </div>
      </div>

      <!-- POINT FILTER CHIPS -->
      <div class="flex gap-1.5 overflow-x-auto pb-1 no-scrollbar">
        <button onclick="filterByPoints('ALL')" class="px-2.5 py-1 bg-purple-600 text-white text-[10px] font-bold rounded-full whitespace-nowrap point-chip" data-point="ALL">All (1,133)</button>
        <button onclick="filterByPoints(3000)" class="px-2.5 py-1 bg-slate-800 text-slate-300 text-[10px] font-bold rounded-full whitespace-nowrap point-chip" data-point="3000">3000 Pts</button>
        <button onclick="filterByPoints(2000)" class="px-2.5 py-1 bg-slate-800 text-slate-300 text-[10px] font-bold rounded-full whitespace-nowrap point-chip" data-point="2000">2000 Pts</button>
        <button onclick="filterByPoints(1000)" class="px-2.5 py-1 bg-slate-800 text-slate-300 text-[10px] font-bold rounded-full whitespace-nowrap point-chip" data-point="1000">1000 Pts</button>
        <button onclick="filterByPoints(500)" class="px-2.5 py-1 bg-slate-800 text-slate-300 text-[10px] font-bold rounded-full whitespace-nowrap point-chip" data-point="500">500 Pts</button>
        <button onclick="filterByPoints(200)" class="px-2.5 py-1 bg-slate-800 text-slate-300 text-[10px] font-bold rounded-full whitespace-nowrap point-chip" data-point="200">200 Pts</button>
        <button onclick="filterByPoints(100)" class="px-2.5 py-1 bg-slate-800 text-slate-300 text-[10px] font-bold rounded-full whitespace-nowrap point-chip" data-point="100">100 Pts</button>
      </div>

      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-500 text-xs"></i>
        <input type="text" id="search-input" oninput="renderSkinLibrary()" placeholder="Search all 1,133 skins..." class="w-full bg-[#151b2a] border border-slate-700/80 rounded-lg pl-8 pr-3 py-1.5 text-xs text-white focus:outline-none focus:border-purple-500">
      </div>
      
      <div id="library-render-area" class="space-y-4 pt-1 max-h-56 overflow-y-auto pr-1"></div>
    </div>

    <!-- LAYOUT CONFIG -->
    <div id="tab-layout" class="hidden space-y-3 control-tab-content">
      <h3 class="text-xs font-bold text-white border-b border-slate-800 pb-1.5">Grid Architecture</h3>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-[10px] text-slate-400 block mb-1 font-semibold">Columns</label>
          <input type="number" id="grid-cols" value="4" min="1" max="10" onchange="updateLayoutConfig()" class="w-full bg-[#151b2a] border border-slate-700 rounded p-1.5 text-xs text-center font-bold text-white focus:border-purple-500 focus:outline-none">
        </div>
        <div>
          <label class="text-[10px] text-slate-400 block mb-1 font-semibold">Rows (Auto)</label>
          <input type="number" id="grid-rows" value="4" readonly class="w-full bg-[#151b2a]/50 border border-slate-700/50 rounded p-1.5 text-xs text-center font-bold text-slate-400 cursor-not-allowed">
        </div>
      </div>
    </div>

    <!-- EFFECTS -->
    <div id="tab-effects" class="hidden space-y-3 control-tab-content">
      <div class="flex justify-between items-center border-b border-slate-800 pb-1.5">
        <h3 class="text-xs font-bold text-white">Visual Filters</h3>
        <button onclick="resetEffects()" class="text-[10px] text-purple-400 hover:text-purple-300 font-semibold">Reset</button>
      </div>
      <div class="grid grid-cols-2 gap-2.5 text-[10px] text-slate-400">
        <div>
          <label class="block mb-1">Brightness (<span id="val-b">100</span>%)</label>
          <input type="range" id="fx-b" min="50" max="150" value="100" oninput="redrawCanvas()" class="w-full accent-purple-500">
        </div>
        <div>
          <label class="block mb-1">Saturation (<span id="val-s">100</span>%)</label>
          <input type="range" id="fx-s" min="0" max="200" value="100" oninput="redrawCanvas()" class="w-full accent-purple-500">
        </div>
      </div>
    </div>

    <!-- EXPORT ENGINE -->
    <div id="tab-export" class="hidden space-y-3 control-tab-content">
      <h3 class="text-xs font-bold text-white border-b border-slate-800 pb-1.5">Export Image</h3>
      <button onclick="executeCanvasDownload()" class="w-full py-2.5 bg-purple-600 hover:bg-purple-500 text-white font-extrabold text-xs rounded-lg shadow-lg transition mt-2 flex items-center justify-center gap-2">
        <i class="fa-solid fa-download"></i> DOWNLOAD IMAGE
      </button>
    </div>

  </div>

  <!-- NAVIGATION BAR -->
  <nav class="fixed bottom-0 inset-x-0 bg-[#0a0e17] border-t border-slate-800 px-4 py-2 flex justify-around items-center z-50">
    <button onclick="toggleTab('tab-skins')" id="btn-tab-skins" class="nav-btn text-purple-400 flex flex-col items-center gap-1 text-[10px] font-semibold">
      <i class="fa-solid fa-layer-group text-sm"></i>
      <span>Skins</span>
    </button>
    <button onclick="toggleTab('tab-layout')" id="btn-tab-layout" class="nav-btn text-slate-400 flex flex-col items-center gap-1 text-[10px] font-semibold">
      <i class="fa-solid fa-border-all text-sm"></i>
      <span>Layout</span>
    </button>
    <button onclick="toggleTab('tab-effects')" id="btn-tab-effects" class="nav-btn text-slate-400 flex flex-col items-center gap-1 text-[10px] font-semibold">
      <i class="fa-solid fa-wand-magic-sparkles text-sm"></i>
      <span>Effects</span>
    </button>
    <button onclick="toggleTab('tab-export')" id="btn-tab-export" class="nav-btn text-slate-400 flex flex-col items-center gap-1 text-[10px] font-semibold">
      <i class="fa-solid fa-download text-sm"></i>
      <span>Export</span>
    </button>
  </nav>

  <script>
    let skinDatabase = [];
    let selectedSkinList = [];
    let activeSkinIndex = 0;
    let tileOffsets = {};
    let imageCache = {};
    let uploadedProfileImage = null;
    let currentPointFilter = 'ALL';
    let columns = 4;
    let currentActiveTab = 'tab-skins';

    const exportCanvas = document.getElementById('main-export-canvas');
    const ctx = exportCanvas.getContext('2d');

    const HERO_NAMES = [
      "Miya", "Balmond", "Saber", "Alice", "Nana", "Tigreal", "Alucard", "Karina", 
      "Akai", "Franco", "Bane", "Bruno", "Clint", "Haya", "Rafaela", "Eudora", 
      "Zilong", "Fanny", "Layla", "Minotaur", "Lolita", "Zask", "Helcurt", "Pharsa", 
      "Lesley", "Jawhead", "Angela", "Gusion", "Valir", "Martis", "Uranus", "Hanabi", 
      "Chang'e", "Kaja", "Selena", "Claude", "Belerick", "Kimmy", "Harith", "Minsitthar", 
      "Badang", "Khufra", "Granger", "Guinevere", "Esmeralda", "Terizla", "X.Borg", 
      "Dyrroth", "Lylia", "Ling", "Baxia", "Masha", "Wanwan", "Silvanna", "Cecilion", 
      "Carmilla", "Atlas", "Popol & Kupa", "Yu Zhong", "Luo Yi", "Benedetta", "Khaleed", 
      "Barats", "Brody", "Yve", "Mathilda", "Gatotkaca", "Grock", "Irithel", "Sun", 
      "Odette", "Vexana", "Argus", "Lapu-Lapu", "Estes", "Hilda", "Aurora", "Johnson", 
      "Freya", "Moskov", "Cyclops", "Yi Sun-shin", "Aura", "Valentina", "Edith", "Floryn", 
      "Aamon", "Melissa", "Xavier", "Julian", "Fredrinn", "Joy", "Novaria", 
      "Arlott", "Ixia", "Nolan", "Cici", "Chip", "Zhuxin", "Suyou", "Lukas"
    ];

    const SKIN_TIERS = [
      { name: "Legend Skin", points: 3000, color: "#ea580c" },
      { name: "Collector Skin", points: 3000, color: "#d97706" },
      { name: "Collector Edition", points: 2000, color: "#7c3aed" },
      { name: "Epic Showcase", points: 2000, color: "#db2777" },
      { name: "Starlight Annual", points: 1000, color: "#2563eb" },
      { name: "Special Edition", points: 1000, color: "#059669" },
      { name: "S.A.B.E.R. / V.E.N.O.M.", points: 500, color: "#16a34a" },
      { name: "Elite Skin", points: 200, color: "#b45309" },
      { name: "Basic Skin", points: 100, color: "#475569" }
    ];

    function createSkinPortraitURI(heroName, skinTier, points, accentColor) {
      const canvas = document.createElement('canvas');
      canvas.width = 220;
      canvas.height = 220;
      const tCtx = canvas.getContext('2d');

      const grad = tCtx.createLinearGradient(0, 0, 220, 220);
      grad.addColorStop(0, '#0b1120');
      grad.addColorStop(0.5, accentColor);
      grad.addColorStop(1, '#020617');
      tCtx.fillStyle = grad;
      tCtx.fillRect(0, 0, 220, 220);

      tCtx.fillStyle = 'rgba(255, 255, 255, 0.12)';
      tCtx.beginPath();
      tCtx.arc(110, 75, 45, 0, Math.PI * 2);
      tCtx.fill();
      
      tCtx.beginPath();
      tCtx.ellipse(110, 155, 65, 40, 0, 0, Math.PI * 2);
      tCtx.fill();

      tCtx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
      tCtx.lineWidth = 3;
      tCtx.strokeRect(8, 8, 204, 204);

      tCtx.fillStyle = '#ffffff';
      tCtx.font = 'bold 21px sans-serif';
      tCtx.textAlign = 'center';
      tCtx.textBaseline = 'middle';
      tCtx.shadowColor = 'rgba(0,0,0,0.95)';
      tCtx.shadowBlur = 10;
      tCtx.fillText(heroName, 110, 82);

      tCtx.fillStyle = '#e2e8f0';
      tCtx.font = '11px sans-serif';
      tCtx.fillText(skinTier, 110, 110);

      tCtx.fillStyle = 'rgba(15, 23, 42, 0.95)';
      tCtx.roundRect(35, 155, 150, 32, 8);
      tCtx.fill();
      tCtx.strokeStyle = accentColor;
      tCtx.lineWidth = 2;
      tCtx.stroke();

      tCtx.fillStyle = '#ffffff';
      tCtx.font = 'bold 14px sans-serif';
      tCtx.fillText(`${points} Pts`, 110, 171);

      return canvas.toDataURL('image/jpeg', 0.9);
    }

    function generateFullSkinDatabase() {
      skinDatabase = [];
      let idCounter = 1;

      while (skinDatabase.length < 1133) {
        for (let hIndex = 0; hIndex < HERO_NAMES.length; hIndex++) {
          if (skinDatabase.length >= 1133) break;
          const hero = HERO_NAMES[hIndex];
          const tierIndex = (skinDatabase.length + hIndex) % SKIN_TIERS.length;
          const tier = SKIN_TIERS[tierIndex];
          const variantNum = Math.floor(skinDatabase.length / HERO_NAMES.length) + 1;
          const skinName = variantNum === 1 ? tier.name : `${tier.name} V${variantNum}`;
          
          skinDatabase.push({
            id: `sk_${idCounter++}`,
            hero: hero,
            skin: skinName,
            points: tier.points,
            img: createSkinPortraitURI(hero, skinName, tier.points, tier.color)
          });
        }
      }

      selectedSkinList = skinDatabase.slice(0, 16);
      renderSkinLibrary();
      redrawCanvas();
    }

    function filterByPoints(pts) {
      currentPointFilter = pts;
      document.querySelectorAll('.point-chip').forEach(btn => {
        if ((btn.dataset.point === 'ALL' && pts === 'ALL') || btn.dataset.point == pts) {
          btn.className = 'px-2.5 py-1 bg-purple-600 text-white text-[10px] font-bold rounded-full whitespace-nowrap point-chip';
        } else {
          btn.className = 'px-2.5 py-1 bg-slate-800 text-slate-300 text-[10px] font-bold rounded-full whitespace-nowrap point-chip';
        }
      });
      renderSkinLibrary();
    }

    function renderSkinLibrary() {
      const container = document.getElementById('library-render-area');
      const query = document.getElementById('search-input').value.toLowerCase();
      container.innerHTML = '';

      const filtered = skinDatabase.filter(item => {
        const matchesQuery = item.hero.toLowerCase().includes(query) || item.skin.toLowerCase().includes(query);
        const matchesPoints = (currentPointFilter === 'ALL' || item.points == currentPointFilter);
        return matchesQuery && matchesPoints;
      });

      const gridDiv = document.createElement('div');
      gridDiv.className = 'grid grid-cols-3 gap-2.5 pt-1';

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center text-xs text-slate-500 py-4">No matching skins found.</div>`;
        return;
      }

      const displaySubset = filtered.slice(0, 150);

      displaySubset.forEach(skin => {
        const isSelected = selectedSkinList.some(s => s.id === skin.id);
        const card = document.createElement('div');
        card.className = `flex flex-col items-center p-2 rounded-xl cursor-pointer transition border ${isSelected ? 'bg-purple-950/30 border-purple-500' : 'bg-[#141b2d] border-slate-800 hover:border-slate-700'}`;
        card.onclick = () => toggleSkinSelection(skin.id);

        card.innerHTML = `
          <div class="relative w-16 h-16 rounded-lg overflow-hidden border border-slate-700 mb-1 bg-slate-900">
            <img src="${skin.img}" class="w-full h-full object-cover" alt="${skin.hero}">
            ${isSelected ? '<div class="absolute top-1 right-1 bg-purple-600 text-white rounded-full w-4 h-4 flex items-center justify-center text-[8px] border border-slate-900"><i class="fa-solid fa-check"></i></div>' : ''}
          </div>
          <span class="text-[10px] text-white font-bold text-center truncate w-full">${skin.hero}</span>
          <span class="text-[9px] text-purple-400 font-semibold">${skin.points} Pts</span>
        `;
        gridDiv.appendChild(card);
      });

      if (filtered.length > 150) {
        const notice = document.createElement('div');
        notice.className = 'col-span-3 text-center text-[10px] text-slate-400 py-2';
        notice.textContent = `Showing 150 of ${filtered.length} filtered skins (Use search to pinpoint)`;
        gridDiv.appendChild(notice);
      }

      container.appendChild(gridDiv);
      document.getElementById('catalog-counter').textContent = `${selectedSkinList.length} Selected`;
    }

    function toggleSkinSelection(skinId) {
      const item = skinDatabase.find(s => s.id === skinId);
      if (!item) return;

      const idx = selectedSkinList.findIndex(s => s.id === skinId);
      if (idx >= 0) {
        selectedSkinList.splice(idx, 1);
      } else {
        selectedSkinList.push(item);
      }
      renderSkinLibrary();
      redrawCanvas();
    }

    function selectAllVisibleSkins() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const filtered = skinDatabase.filter(item => {
        const matchesQuery = item.hero.toLowerCase().includes(query) || item.skin.toLowerCase().includes(query);
        const matchesPoints = (currentPointFilter === 'ALL' || item.points == currentPointFilter);
        return matchesQuery && matchesPoints;
      });

      filtered.forEach(skin => {
        if (!selectedSkinList.some(s => s.id === skin.id)) {
          selectedSkinList.push(skin);
        }
      });
      renderSkinLibrary();
      redrawCanvas();
    }

    function clearAllSelectedSkins() {
      selectedSkinList = [];
      renderSkinLibrary();
      redrawCanvas();
    }

    function updateLayoutConfig() {
      columns = Math.max(1, parseInt(document.getElementById('grid-cols').value) || 1);
      redrawCanvas();
    }

    function redrawCanvas() {
      const tileSize = 95;
      const gap = 8;
      const headerHeight = uploadedProfileImage ? 160 : 0;

      const totalItems = selectedSkinList.length;
      if (totalItems === 0) {
        document.getElementById('grid-rows').value = 1;
        exportCanvas.width = (columns * tileSize) + ((columns + 1) * gap);
        exportCanvas.height = headerHeight + tileSize + (2 * gap);
        ctx.fillStyle = "#090d16";
        ctx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
        return;
      }

      let calculatedRows = Math.ceil(totalItems / columns);
      document.getElementById('grid-rows').value = calculatedRows;

      exportCanvas.width = (columns * tileSize) + ((columns + 1) * gap);
      exportCanvas.height = headerHeight + (calculatedRows * tileSize) + ((calculatedRows + 1) * gap);

      ctx.fillStyle = "#090d16";
      ctx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);

      const b = document.getElementById('fx-b').value;
      const s = document.getElementById('fx-s').value;
      ctx.filter = `brightness(${b}%) saturate(${s}%)`;

      if (uploadedProfileImage) {
        ctx.drawImage(uploadedProfileImage, gap, gap, exportCanvas.width - (gap * 2), 144);
      }

      for (let i = 0; i < totalItems; i++) {
        const col = i % columns;
        const row = Math.floor(i / columns);

        const x = gap + col * (tileSize + gap);
        const y = headerHeight + gap + row * (tileSize + gap);

        const skin = selectedSkinList[i];
        const isSelected = (i === activeSkinIndex);
        if (!tileOffsets[i]) tileOffsets[i] = { x: 0, y: 0 };
        const offset = tileOffsets[i];

        if (!imageCache[skin.img]) {
          const img = new Image();
          img.src = skin.img;
          img.onload = () => {
            imageCache[skin.img] = img;
            redrawCanvas();
          };
          imageCache[skin.img] = img;
        }

        const cachedImg = imageCache[skin.img];
        if (cachedImg && cachedImg.complete && cachedImg.naturalWidth !== 0) {
          ctx.save();
          ctx.beginPath();
          ctx.roundRect(x, y, tileSize, tileSize, 10);
          ctx.clip();
          ctx.drawImage(cachedImg, x + offset.x, y + offset.y, tileSize, tileSize);
          ctx.restore();
        }

        ctx.strokeStyle = isSelected ? "#a855f7" : "#334155";
        ctx.lineWidth = isSelected ? 3 : 1;
        ctx.beginPath();
        ctx.roundRect(x, y, tileSize, tileSize, 10);
        ctx.stroke();

        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.fillRect(x + 4, y + tileSize - 22, tileSize - 8, 18);
        ctx.fillStyle = '#a855f7';
        ctx.font = 'bold 9px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`${skin.points} Pts`, x + (tileSize / 2), y + tileSize - 9);
      }

      ctx.filter = "none";
    }

    const screenshotInput = document.getElementById('user-screenshot-input');
    const screenshotPreview = document.getElementById('screenshot-preview');
    const uploadLabel = document.getElementById('upload-label');
    const deleteBtn = document.getElementById('delete-screenshot-btn');

    screenshotInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            uploadedProfileImage = img;
            screenshotPreview.src = event.target.result;
            screenshotPreview.classList.remove('hidden');
            uploadLabel.classList.add('hidden');
            deleteBtn.classList.remove('hidden');
            redrawCanvas();
          };
        };
        reader.readAsDataURL(file);
      }
    });

    function clearUploadedScreenshot() {
      screenshotInput.value = "";
      uploadedProfileImage = null;
      screenshotPreview.src = "";
      screenshotPreview.classList.add('hidden');
      uploadLabel.classList.add('hidden');
      deleteBtn.classList.add('hidden');
      redrawCanvas();
    }

    function nudgeActiveTile(dx, dy) {
      if (!tileOffsets[activeSkinIndex]) tileOffsets[activeSkinIndex] = { x: 0, y: 0 };
      tileOffsets[activeSkinIndex].x += dx;
      tileOffsets[activeSkinIndex].y += dy;
      redrawCanvas();
    }

    exportCanvas.addEventListener('click', (e) => {
      const rect = exportCanvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      const tileSize = 95;
      const gap = 8;
      const headerHeight = uploadedProfileImage ? 160 : 0;

      const col = Math.floor((clickX - gap) / (tileSize + gap));
      const row = Math.floor((clickY - headerHeight - gap) / (tileSize + gap));

      if (col >= 0 && col < columns && row >= 0) {
        const idx = (row * columns) + col;
        if (idx < selectedSkinList.length) {
          activeSkinIndex = idx;
          redrawCanvas();
        }
      }
    });

    function executeCanvasDownload() {
      const offCanvas = document.createElement('canvas');
      offCanvas.width = exportCanvas.width * 2;
      offCanvas.height = exportCanvas.height * 2;
      const offCtx = offCanvas.getContext('2d');
      offCtx.scale(2, 2);
      offCtx.drawImage(exportCanvas, 0, 0);

      const downloadLink = document.createElement('a');
      downloadLink.download = `MLBB_1133_Skins_Collage_${Date.now()}.png`;
      downloadLink.href = offCanvas.toDataURL('image/png', 1.0);
      downloadLink.click();
    }

    function toggleTab(tabId) {
      const targetDiv = document.getElementById(tabId);
      const targetBtn = document.getElementById(`btn-${tabId}`);
      
      if (currentActiveTab === tabId) {
        targetDiv.classList.add('hidden');
        targetBtn.classList.replace('text-purple-400', 'text-slate-400');
        currentActiveTab = null;
      } else {
        document.querySelectorAll('.control-tab-content').forEach(div => div.classList.add('hidden'));
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.replace('text-purple-400', 'text-slate-400'));
        
        targetDiv.classList.remove('hidden');
        targetBtn.classList.replace('text-slate-400', 'text-purple-400');
        currentActiveTab = tabId;
      }
    }

    function resetEffects() {
      document.getElementById('fx-b').value = 100;
      document.getElementById('fx-s').value = 100;
      redrawCanvas();
    }

    generateFullSkinDatabase();
  </script>
</body>
</html>
