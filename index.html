<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MLBB Skin Collage Tool - Real Assets Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#090d16] text-slate-200 min-h-screen flex flex-col font-sans select-none pb-24">

  <!-- TOP NAV -->
  <header class="p-3 border-b border-slate-800 bg-[#0d121f] flex items-center justify-between sticky top-0 z-50">
    <div class="flex items-center gap-2">
      <div class="w-7 h-7 rounded-lg bg-purple-600 flex items-center justify-center text-white font-black text-xs shadow-lg shadow-purple-500/30">M</div>
      <h1 class="font-extrabold text-white text-sm tracking-wide">MLBB <span class="text-purple-400">Collage</span></h1>
    </div>
    <button onclick="exportCollage()" class="px-3.5 py-1.5 bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs rounded-lg shadow-lg shadow-purple-600/30 transition flex items-center gap-1.5">
      <i class="fa-solid fa-download"></i> Export PNG
    </button>
  </header>

  <!-- MAIN WORKSPACE -->
  <main class="p-4 flex-1 flex flex-col items-center justify-start max-w-lg mx-auto w-full gap-4">
    
    <!-- ACCOUNT SCREENSHOT UPLOAD BAR -->
    <div class="w-full bg-[#111726] border border-slate-800 rounded-2xl p-3 flex items-center justify-between gap-3 shadow-md">
      <label class="flex items-center gap-3 cursor-pointer flex-1">
        <div class="w-10 h-10 rounded-xl bg-purple-900/40 border border-purple-500/30 flex items-center justify-center text-purple-400">
          <i class="fa-solid fa-cloud-arrow-up text-sm"></i>
        </div>
        <div class="flex flex-col">
          <span class="text-xs font-bold text-white">Upload Account Screenshot</span>
          <span class="text-[10px] text-slate-400">PNG, JPG header overlay (Optional)</span>
        </div>
        <input type="file" id="header-input" accept="image/*" class="hidden">
      </label>
      <button id="clear-header-btn" onclick="clearHeaderImage()" class="hidden text-xs text-red-400 hover:text-red-300 font-semibold px-2 py-1">Remove</button>
    </div>

    <!-- CANVAS DISPLAY CONTAINER -->
    <div class="w-full bg-[#0e1320] border border-slate-800/80 rounded-2xl p-3 shadow-2xl flex flex-col items-center justify-center min-h-[220px] overflow-hidden">
      <canvas id="collage-canvas" class="max-w-full h-auto rounded-lg shadow-lg"></canvas>
    </div>

    <!-- GRID LAYOUT CONTROLS -->
    <div class="w-full bg-[#111726] border border-slate-800 rounded-xl p-3 flex items-center justify-between gap-2 text-xs">
      <div class="flex items-center gap-2">
        <span class="text-slate-400 font-medium">Grid:</span>
        <span id="grid-size-label" class="font-bold text-white">4 x 4</span>
      </div>
      <div class="flex items-center gap-2">
        <label class="text-slate-400">Cols:</label>
        <select id="col-select" onchange="updateLayout()" class="bg-[#0d121f] border border-slate-700 rounded px-2 py-1 text-white font-bold focus:outline-none focus:border-purple-500">
          <option value="3">3</option>
          <option value="4" selected>4</option>
          <option value="5">5</option>
          <option value="6">6</option>
        </select>
        <label class="text-slate-400 ml-1">Rows:</label>
        <select id="row-select" onchange="updateLayout()" class="bg-[#0d121f] border border-slate-700 rounded px-2 py-1 text-white font-bold focus:outline-none focus:border-purple-500">
          <option value="3">3</option>
          <option value="4" selected>4</option>
          <option value="5">5</option>
          <option value="6">6</option>
        </select>
      </div>
    </div>

    <!-- SKIN SELECTOR & TIER LIBRARY -->
    <div class="w-full bg-[#111726] border border-slate-800 rounded-2xl p-4 flex flex-col gap-3 shadow-md">
      
      <!-- HEADER & COUNTER -->
      <div class="flex justify-between items-center">
        <div class="flex items-center gap-2">
          <h2 class="text-xs font-extrabold text-white uppercase tracking-wider">Skin Library</h2>
          <span id="selection-counter" class="bg-purple-900/60 text-purple-300 border border-purple-500/30 text-[10px] px-2 py-0.5 rounded-full font-bold">0 Selected</span>
        </div>
        <div class="flex items-center gap-3">
          <button onclick="selectAllInTier()" class="text-[11px] text-purple-400 hover:text-purple-300 font-bold">Select Tier</button>
          <button onclick="clearAllSkins()" class="text-[11px] text-red-400 hover:text-red-300 font-bold">Clear All</button>
        </div>
      </div>

      <!-- TIER TABS -->
      <div id="tier-tabs" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1 border-b border-slate-800"></div>

      <!-- SEARCH BAR -->
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-500 text-xs"></i>
        <input type="text" id="search-input" oninput="renderSkinGrid()" placeholder="Search by hero or skin name..." class="w-full bg-[#0d121f] border border-slate-800 rounded-xl pl-8 pr-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-purple-500">
      </div>

      <!-- SKINS GRID -->
      <div id="skin-grid" class="grid grid-cols-4 gap-2.5 max-h-72 overflow-y-auto p-1 no-scrollbar"></div>
    </div>

  </main>

  <script>
    // CORS-safe proxy wrapper to guarantee external artwork loads and exports cleanly
    const proxy = (url) => `https://wsrv.nl/?url=${encodeURIComponent(url)}&w=200&h=200&fit=cover&output=webp`;

    // Authentic MLBB Artwork Catalog grouped by Tiers
    const SKIN_DATABASE = [
      // LEGEND
      { id: "leg_1", hero: "Miya", name: "Modena Butterfly", tier: "Legend", img: proxy("https://static.wikia.nocookie.net/mobile-legends/images/1/14/Modena_Butterfly.png") },
      { id: "leg_2", hero: "Gord", name: "Conqueror", tier: "Legend", img: proxy("https://static.wikia.nocookie.net/mobile-legends/images/4/41/Conqueror.png") },
      { id: "leg_3", hero: "Alucard", name: "Obsidian Blade", tier: "Legend", img: proxy("https://static.wikia.nocookie.net/mobile-legends/images/b/b3/Obsidian_Blade.png") },
      { id: "leg_4", hero: "Lesley", name: "Angelic Agent", tier: "Legend", img: proxy("https://static.wikia.nocookie.net/mobile-legends/images/9/91/Angelic_Agent.png") },
      { id: "leg_5", hero: "Gusion", name: "Cosmic Gleam", tier: "Legend", img: proxy("https://static.wikia.nocookie.net/mobile-legends/images/e/e0/Cosmic_Gleam.png") },
      { id: "leg_6", hero: "Valir", name: "Infernal Blaze", tier: "Legend", img: proxy("https://static.wikia.nocookie.net/mobile-legends/images/8/87/Infernal_Blaze.png") },
      { id: "leg_7", hero: "Franco", name: "King of Hell", tier: "Legend", img: proxy("https://static.wikia.nocookie.net/mobile-legends/images/a/a2/King_of_Hell.png") },
      { id: "leg_8", hero: "Freya", name: "Galactic Vanquisher", tier: "Legend", img: proxy("https://static.wikia.nocookie.net/mobile-legends/images/d/df/Galactic_Vanquisher.png") },
      
      // COLLECTOR
      { id: "col_1", hero: "Pharsa", name: "Empress Phoenix", tier: "Collector", img: proxy("https://static.wikia.nocookie.net/mobile-legends/images/3/30/Empress_Phoenix.png") },
      { id: "col_2", hero: "Benedetta", name: "Death Oath", tier: "Collector", img: proxy("https://static.wikia.nocookie.net/mobile-legends/images/0/07/Death_Oath.png") },
      { id: "col_3", hero: "Yu Zhong", name: "Blood Serpent", tier: "Collector", img: proxy("https://static.wikia.nocookie.net/mobile-legends/images/f/f3/Blood_Serpent.png") },
      { id: "col_4", hero: "Ling", name: "Serene Plume", tier: "Collector", img: proxy("https://static.wikia.nocookie.net/mobile-legends/images/9/9e/Serene_Plume.png") },
      { id: "col_5", hero: "Granger", name: "Agent Z", tier: "Collector", img: proxy("https://static.wikia.nocookie.net/mobile-legends/images/1/10/Agent_Z.png") },
      { id: "col_6", hero: "Nana", name: "Aqua Pura", tier: "Collector", img: proxy("https://static.wikia.nocookie.net/mobile-legends/images/6/69/Aqua_Pura.png") },
      { id: "col_7", hero: "Aldous", name: "Realm Watcher", tier: "Collector", img: proxy("https://static.wikia.nocookie.net/mobile-legends/images/6/66/Realm_Watcher.png") },
      { id: "col_8", hero: "Angela", name: "Floral Elf", tier: "Collector", img: proxy("https://static.wikia.nocookie.net/mobile-legends/images/b/be/Floral_Elf.png") },

      // S.T.U.N.
      { id: "stun_1", hero: "Chou", name: "S.T.U.N. Chou", tier: "S.T.U.N.", img: proxy("https://static.wikia.nocookie.net/mobile-legends/images/3/3c/S.T.U.N._Chou.png") },
      { id: "stun_2", hero: "Brody", name: "S.T.U.N. Brody", tier: "S.T.U.N.", img: proxy("https://static.wikia.nocookie.net/mobile-legends/images/c/c9/S.T.U.N._Brody.png") },
      { id: "stun_3", hero: "Selena", name: "S.T.U.N. Selena", tier: "S.T.U.N.", img: proxy("https://static.wikia.nocookie.net/mobile-legends/images/f/f7/S.T.U.N._Selena.png") },

      // EPIC
      { id: "epic_1", hero: "Hayabusa", name: "Shadow of Obscurity", tier: "Epic", img: proxy("https://static.wikia.nocookie.net/mobile-legends/images/6/6e/Shadow_of_Obscurity.png") },
      { id: "epic_2", hero: "Kagura", name: "Soryu Maiden", tier: "Epic", img: proxy("https://static.wikia.nocookie.net/mobile-legends/images/e/e0/Soryu_Maiden.png") },
      { id: "epic_3", hero: "Lancelot", name: "Royal Matador", tier: "Epic", img: proxy("https://static.wikia.nocookie.net/mobile-legends/images/c/c5/Royal_Matador.png") },
      { id: "epic_4", hero: "Estes", name: "Rattan Dragon", tier: "Epic", img: proxy("https://static.wikia.nocookie.net/mobile-legends/images/f/fc/Rattan_Dragon.png") },
      { id: "epic_5", hero: "Kimmy", name: "Frost Wing", tier: "Epic", img: proxy("https://static.wikia.nocookie.net/mobile-legends/images/3/31/Frost_Wing.png") }
    ];

    const TIERS = ["Legend", "Collector", "S.T.U.N.", "Epic"];
    let currentTier = "Legend";
    let selectedIds = new Set(["leg_1", "leg_2", "leg_3", "leg_4", "col_1", "col_2", "col_3", "col_4"]);
    let imageCache = {};
    let headerImage = null;

    // Render Tier Navigation Tabs
    function renderTierTabs() {
      const container = document.getElementById('tier-tabs');
      container.innerHTML = '';
      TIERS.forEach(tier => {
        const btn = document.createElement('button');
        const active = currentTier === tier;
        btn.className = `px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap transition ${
          active 
            ? 'bg-purple-600 text-white shadow-md shadow-purple-600/30' 
            : 'bg-[#141b2d] text-slate-400 hover:text-white border border-slate-800'
        }`;
        btn.textContent = tier;
        btn.onclick = () => {
          currentTier = tier;
          renderTierTabs();
          renderSkinGrid();
        };
        container.appendChild(btn);
      });
    }

    // Render Skin Library Grid
    function renderSkinGrid() {
      const grid = document.getElementById('skin-grid');
      const query = document.getElementById('search-input').value.toLowerCase();
      grid.innerHTML = '';

      const filtered = SKIN_DATABASE.filter(skin => {
        const matchesTier = skin.tier === currentTier;
        const matchesQuery = skin.hero.toLowerCase().includes(query) || skin.name.toLowerCase().includes(query);
        return query ? matchesQuery : matchesTier;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-4 py-8 text-center text-xs text-slate-500 font-medium">No skins found</div>`;
        return;
      }

      filtered.forEach(skin => {
        const isSelected = selectedIds.has(skin.id);
        const card = document.createElement('div');
        card.className = `group flex flex-col items-center p-1.5 rounded-xl cursor-pointer border transition relative overflow-hidden ${
          isSelected 
            ? 'bg-purple-950/40 border-purple-500 shadow-md' 
            : 'bg-[#141b2d] border-slate-800/80 hover:border-slate-700'
        }`;
        
        card.onclick = () => {
          if (isSelected) selectedIds.delete(skin.id);
          else selectedIds.add(skin.id);
          renderSkinGrid();
          updateLayout();
        };

        card.innerHTML = `
          <div class="w-full aspect-square rounded-lg bg-slate-900 overflow-hidden relative mb-1 border border-slate-800">
            <img src="${skin.img}" crossorigin="anonymous" class="w-full h-full object-cover transition duration-300 group-hover:scale-105" alt="${skin.hero}">
            ${isSelected ? '<div class="absolute top-1 right-1 bg-purple-600 text-white rounded-full w-4 h-4 flex items-center justify-center text-[9px] shadow"><i class="fa-solid fa-check"></i></div>' : ''}
          </div>
          <span class="text-[11px] font-extrabold text-white truncate w-full text-center leading-tight">${skin.hero}</span>
          <span class="text-[9px] text-slate-400 truncate w-full text-center leading-tight">${skin.name}</span>
        `;
        grid.appendChild(card);
      });

      document.getElementById('selection-counter').textContent = `${selectedIds.size} Selected`;
    }

    function selectAllInTier() {
      SKIN_DATABASE.filter(s => s.tier === currentTier).forEach(s => selectedIds.add(s.id));
      renderSkinGrid();
      updateLayout();
    }

    function clearAllSkins() {
      selectedIds.clear();
      renderSkinGrid();
      updateLayout();
    }

    // Canvas Layout & Drawing
    const canvas = document.getElementById('collage-canvas');
    const ctx = canvas.getContext('2d');

    function updateLayout() {
      const cols = parseInt(document.getElementById('col-select').value);
      const rows = parseInt(document.getElementById('row-select').value);
      document.getElementById('grid-size-label').textContent = `${cols} x ${rows}`;
      drawCollage(cols, rows);
    }

    function drawCollage(cols, rows) {
      const tileSize = 110;
      const gap = 6;
      const headerH = headerImage ? 140 : 0;
      const selectedList = SKIN_DATABASE.filter(s => selectedIds.has(s.id));

      const totalCols = cols;
      const totalRows = Math.max(rows, Math.ceil(selectedList.length / cols) || 1);

      canvas.width = (totalCols * tileSize) + ((totalCols + 1) * gap);
      canvas.height = headerH + (totalRows * tileSize) + ((totalRows + 1) * gap);

      // Background
      ctx.fillStyle = "#090d16";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Account Screenshot Header if uploaded
      if (headerImage) {
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(gap, gap, canvas.width - (gap * 2), headerH - gap, 12);
        ctx.clip();
        ctx.drawImage(headerImage, gap, gap, canvas.width - (gap * 2), headerH - gap);
        ctx.restore();
      }

      if (selectedList.length === 0) {
        ctx.fillStyle = "#475569";
        ctx.font = "bold 13px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("Select skins from the library below to build your collage", canvas.width / 2, (canvas.height + headerH) / 2);
        return;
      }

      selectedList.forEach((skin, idx) => {
        const c = idx % totalCols;
        const r = Math.floor(idx / totalCols);
        const x = gap + c * (tileSize + gap);
        const y = headerH + gap + r * (tileSize + gap);

        // Frame Base
        ctx.fillStyle = "#141b2d";
        ctx.beginPath();
        ctx.roundRect(x, y, tileSize, tileSize, 12);
        ctx.fill();

        // Load & Draw Portrait
        if (!imageCache[skin.id]) {
          const img = new Image();
          img.crossOrigin = "anonymous";
          img.src = skin.img;
          img.onload = () => {
            imageCache[skin.id] = img;
            drawCollage(cols, rows);
          };
          imageCache[skin.id] = null;
        }

        const cachedImg = imageCache[skin.id];
        if (cachedImg && cachedImg.complete && cachedImg.naturalWidth !== 0) {
          ctx.save();
          ctx.beginPath();
          ctx.roundRect(x, y, tileSize, tileSize, 12);
          ctx.clip();
          ctx.drawImage(cachedImg, x, y, tileSize, tileSize);
          ctx.restore();
        }

        // Card Border
        ctx.strokeStyle = "rgba(148, 163, 184, 0.2)";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.roundRect(x, y, tileSize, tileSize, 12);
        ctx.stroke();

        // Hero Name Label Bar
        ctx.fillStyle = "rgba(9, 13, 22, 0.85)";
        ctx.beginPath();
        ctx.roundRect(x + 6, y + tileSize - 24, tileSize - 12, 18, 6);
        ctx.fill();

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 10px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(skin.hero, x + (tileSize / 2), y + tileSize - 11);
      });
    }

    // Header Screenshot Upload
    const headerInput = document.getElementById('header-input');
    headerInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            headerImage = img;
            document.getElementById('clear-header-btn').classList.remove('hidden');
            updateLayout();
          };
        };
        reader.readAsDataURL(file);
      }
    });

    function clearHeaderImage() {
      headerImage = null;
      headerInput.value = "";
      document.getElementById('clear-header-btn').classList.add('hidden');
      updateLayout();
    }

    // Export PNG
    function exportCollage() {
      const link = document.createElement('a');
      link.download = `MLBB_Skin_Collage_${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png', 1.0);
      link.click();
    }

    // Initialize App
    renderTierTabs();
    renderSkinGrid();
    updateLayout();
  </script>
</body>
</html>
