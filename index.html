<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MLBB Complete Skin Showcase - Portrait Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#090d16] text-slate-200 min-h-screen flex flex-col font-sans select-none pb-28">

  <!-- HEADER -->
  <header class="p-3 border-b border-slate-800 bg-[#0d121f] flex items-center justify-between sticky top-0 z-50">
    <div class="flex items-center gap-2">
      <i class="fa-solid fa-crown text-purple-400"></i>
      <h1 class="font-extrabold text-white text-sm">MLBB <span class="text-purple-400">Skin Portraits Tool</span></h1>
    </div>
    <button onclick="executeCanvasDownload()" class="px-3 py-1.5 bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs rounded-lg shadow transition flex items-center gap-1.5">
      <i class="fa-solid fa-download"></i> Export Image
    </button>
  </header>

  <!-- MAIN CANVAS VIEW -->
  <main class="p-4 flex flex-col items-center justify-center">
    <div class="w-full max-w-sm bg-[#0e1320] border border-slate-800 rounded-xl p-3 shadow-2xl flex flex-col gap-3">
      
      <!-- PROFILE SCREENSHOT UPLOAD -->
      <div class="w-full h-32 bg-[#141b2d] rounded-lg border border-slate-700 relative overflow-hidden flex items-center justify-center">
        <label id="upload-label" class="w-full h-full flex flex-col items-center justify-center cursor-pointer p-2">
          <i class="fa-solid fa-cloud-arrow-up text-purple-400 text-xl mb-1"></i>
          <span class="text-xs font-semibold text-slate-300">Upload Profile Screenshot</span>
          <span class="text-[10px] text-slate-500">Optional header image</span>
          <input type="file" id="user-screenshot-input" accept="image/*" class="hidden">
        </label>
        <img id="screenshot-preview" class="w-full h-full object-cover hidden" alt="Profile">
        <button id="delete-screenshot-btn" onclick="clearScreenshot()" class="hidden absolute top-2 right-2 bg-red-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs shadow"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <!-- CANVAS -->
      <div class="w-full flex justify-center overflow-auto">
        <canvas id="main-canvas" class="border border-slate-800 rounded-lg bg-[#090d16] max-w-full"></canvas>
      </div>
    </div>
  </main>

  <!-- SKIN SELECTOR DRAWER -->
  <section class="max-w-md mx-auto w-full px-4 mt-2 flex-1 flex flex-col gap-2">
    <div class="flex justify-between items-center bg-[#0d121f] p-2.5 rounded-xl border border-slate-800">
      <div class="flex items-center gap-2">
        <span class="text-xs font-bold text-white">Select Skins</span>
        <span id="counter-badge" class="bg-purple-900/50 text-purple-300 text-[10px] px-2 py-0.5 rounded-full border border-purple-500/30">0 Selected</span>
      </div>
      <div class="flex gap-2">
        <button onclick="selectAllSkins()" class="text-[10px] text-purple-400 font-semibold hover:underline">Select Filtered</button>
        <button onclick="clearSkins()" class="text-[10px] text-red-400 font-semibold hover:underline">Clear All</button>
      </div>
    </div>

    <!-- SEARCH -->
    <div class="relative">
      <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-500 text-xs"></i>
      <input type="text" id="search-box" oninput="renderLibrary()" placeholder="Search by hero or skin name..." class="w-full bg-[#0d121f] border border-slate-800 rounded-xl pl-8 pr-3 py-2 text-xs text-white focus:outline-none focus:border-purple-500">
    </div>

    <!-- GRID LIBRARY -->
    <div id="skin-grid" class="grid grid-cols-3 gap-2.5 max-h-80 overflow-y-auto p-1.5 bg-[#0d121f]/50 rounded-xl border border-slate-800"></div>
  </section>

  <script>
    const HERO_DATABASE = [
      { name: "Miya", img: "https://raw.githubusercontent.com/MLBB-Tools/assets/main/heroes/miya.png" },
      { name: "Balmond", img: "https://raw.githubusercontent.com/MLBB-Tools/assets/main/heroes/balmond.png" },
      { name: "Saber", img: "https://raw.githubusercontent.com/MLBB-Tools/assets/main/heroes/saber.png" },
      { name: "Alice", img: "https://raw.githubusercontent.com/MLBB-Tools/assets/main/heroes/alice.png" },
      { name: "Nana", img: "https://raw.githubusercontent.com/MLBB-Tools/assets/main/heroes/nana.png" },
      { name: "Tigreal", img: "https://raw.githubusercontent.com/MLBB-Tools/assets/main/heroes/tigreal.png" },
      { name: "Alucard", img: "https://raw.githubusercontent.com/MLBB-Tools/assets/main/heroes/alucard.png" },
      { name: "Karina", img: "https://raw.githubusercontent.com/MLBB-Tools/assets/main/heroes/karina.png" },
      { name: "Akai", img: "https://raw.githubusercontent.com/MLBB-Tools/assets/main/heroes/akai.png" },
      { name: "Franco", img: "https://raw.githubusercontent.com/MLBB-Tools/assets/main/heroes/franco.png" },
      { name: "Bane", img: "https://raw.githubusercontent.com/MLBB-Tools/assets/main/heroes/bane.png" },
      { name: "Bruno", img: "https://raw.githubusercontent.com/MLBB-Tools/assets/main/heroes/bruno.png" },
      { name: "Clint", img: "https://raw.githubusercontent.com/MLBB-Tools/assets/main/heroes/clint.png" },
      { name: "Hayabusa", img: "https://raw.githubusercontent.com/MLBB-Tools/assets/main/heroes/hayabusa.png" },
      { name: "Rafaela", img: "https://raw.githubusercontent.com/MLBB-Tools/assets/main/heroes/rafaela.png" },
      { name: "Eudora", img: "https://raw.githubusercontent.com/MLBB-Tools/assets/main/heroes/eudora.png" },
      { name: "Zilong", img: "https://raw.githubusercontent.com/MLBB-Tools/assets/main/heroes/zilong.png" },
      { name: "Fanny", img: "https://raw.githubusercontent.com/MLBB-Tools/assets/main/heroes/fanny.png" },
      { name: "Layla", img: "https://raw.githubusercontent.com/MLBB-Tools/assets/main/heroes/layla.png" },
      { name: "Minotaur", img: "https://raw.githubusercontent.com/MLBB-Tools/assets/main/heroes/minotaur.png" },
      { name: "Lolita", img: "https://raw.githubusercontent.com/MLBB-Tools/assets/main/heroes/lolita.png" },
      { name: "Hayabusa", img: "https://raw.githubusercontent.com/MLBB-Tools/assets/main/heroes/hayabusa.png" },
      { name: "Freya", img: "https://raw.githubusercontent.com/MLBB-Tools/assets/main/heroes/freya.png" },
      { name: "Gusion", img: "https://raw.githubusercontent.com/MLBB-Tools/assets/main/heroes/gusion.png" },
      { name: "Lesley", img: "https://raw.githubusercontent.com/MLBB-Tools/assets/main/heroes/lesley.png" },
      { name: "Ling", img: "https://raw.githubusercontent.com/MLBB-Tools/assets/main/heroes/ling.png" },
      { name: "Guinevere", img: "https://raw.githubusercontent.com/MLBB-Tools/assets/main/heroes/guinevere.png" },
      { name: "Chou", img: "https://raw.githubusercontent.com/MLBB-Tools/assets/main/heroes/chou.png" },
      { name: "Kagura", img: "https://raw.githubusercontent.com/MLBB-Tools/assets/main/heroes/kagura.png" },
      { name: "Aldous", img: "https://raw.githubusercontent.com/MLBB-Tools/assets/main/heroes/aldous.png" }
    ];

    const TIERS = [
      { name: "Legend", pts: 3000, color: "#ea580c" },
      { name: "Collector", pts: 3000, color: "#d97706" },
      { name: "Epic", pts: 2000, color: "#db2777" },
      { name: "Starlight", pts: 1000, color: "#2563eb" },
      { name: "Special", pts: 500, color: "#059669" },
      { name: "Elite", pts: 200, color: "#b45309" },
      { name: "Basic", pts: 100, color: "#475569" }
    ];

    let allSkins = [];
    let selectedIds = new Set();
    let imageCache = {};
    let profileImage = null;

    // Generates fallback portrait data URI if external artwork fails to load
    function generatePortraitCanvas(name, tier, accentColor) {
      const cvs = document.createElement('canvas');
      cvs.width = 160;
      cvs.height = 160;
      const c = cvs.getContext('2d');

      const grad = c.createLinearGradient(0, 0, 160, 160);
      grad.addColorStop(0, '#0f172a');
      grad.addColorStop(0.5, accentColor);
      grad.addColorStop(1, '#020617');
      c.fillStyle = grad;
      c.fillRect(0, 0, 160, 160);

      c.fillStyle = 'rgba(255, 255, 255, 0.15)';
      c.beginPath();
      c.arc(80, 65, 35, 0, Math.PI * 2);
      c.fill();

      c.beginPath();
      c.ellipse(80, 130, 50, 30, 0, 0, Math.PI * 2);
      c.fill();

      c.fillStyle = '#ffffff';
      c.font = 'bold 16px sans-serif';
      c.textAlign = 'center';
      c.fillText(name, 80, 70);

      c.fillStyle = '#cbd5e1';
      c.font = '11px sans-serif';
      c.fillText(tier, 80, 95);

      return cvs.toDataURL('image/jpeg', 0.9);
    }

    // Initialize 1,133 skins with portrait references
    function initDatabase() {
      let id = 1;
      while (allSkins.length < 1133) {
        for (let i = 0; i < HERO_DATABASE.length; i++) {
          if (allSkins.length >= 1133) break;
          const hero = HERO_DATABASE[i];
          const tier = TIERS[(allSkins.length + i) % TIERS.length];
          const v = Math.floor(allSkins.length / HERO_DATABASE.length) + 1;
          const skinName = v === 1 ? tier.name : `${tier.name} V${v}`;
          
          allSkins.push({
            id: id++,
            hero: hero.name,
            skinName: skinName,
            pts: tier.pts,
            color: tier.color,
            imgUrl: hero.img,
            fallbackImg: generatePortraitCanvas(hero.name, skinName, tier.color)
          });
        }
      }

      // Default select the first 12 skins
      for (let i = 0; i < 12; i++) selectedIds.add(allSkins[i].id);
      renderLibrary();
      redrawCanvas();
    }

    function renderLibrary() {
      const grid = document.getElementById('skin-grid');
      const query = document.getElementById('search-box').value.toLowerCase();
      grid.innerHTML = '';

      const filtered = allSkins.filter(s => 
        s.hero.toLowerCase().includes(query) || s.skinName.toLowerCase().includes(query)
      );

      filtered.slice(0, 120).forEach(skin => {
        const isSelected = selectedIds.has(skin.id);
        const card = document.createElement('div');
        card.className = `flex flex-col items-center p-2 rounded-xl cursor-pointer border transition ${
          isSelected ? 'bg-purple-950/50 border-purple-500 shadow-md' : 'bg-[#141b2d] border-slate-800 hover:border-slate-700'
        }`;
        card.onclick = () => {
          if (isSelected) selectedIds.delete(skin.id);
          else selectedIds.add(skin.id);
          renderLibrary();
          redrawCanvas();
        };

        card.innerHTML = `
          <div class="w-16 h-16 rounded-lg bg-slate-900 border border-slate-700 overflow-hidden relative mb-1" style="border-top: 3px solid ${skin.color}">
            <img src="${skin.imgUrl}" onerror="this.onerror=null; this.src='${skin.fallbackImg}'" crossorigin="anonymous" class="w-full h-full object-cover" alt="${skin.hero}">
            ${isSelected ? '<div class="absolute top-1 right-1 bg-purple-600 text-white rounded-full w-4 h-4 flex items-center justify-center text-[9px]">✓</div>' : ''}
          </div>
          <span class="text-[10px] font-bold text-white truncate w-full text-center">${skin.hero}</span>
          <span class="text-[9px] text-purple-300 font-semibold">${skin.pts} Pts</span>
        `;
        grid.appendChild(card);
      });

      document.getElementById('counter-badge').textContent = `${selectedIds.size} Selected`;
    }

    function selectAllSkins() {
      const query = document.getElementById('search-box').value.toLowerCase();
      allSkins.filter(s => s.hero.toLowerCase().includes(query) || s.skinName.toLowerCase().includes(query))
              .forEach(s => selectedIds.add(s.id));
      renderLibrary();
      redrawCanvas();
    }

    function clearSkins() {
      selectedIds.clear();
      renderLibrary();
      redrawCanvas();
    }

    const canvas = document.getElementById('main-canvas');
    const ctx = canvas.getContext('2d');

    function redrawCanvas() {
      const tileSize = 90;
      const gap = 8;
      const cols = 4;
      const headerH = profileImage ? 130 : 0;
      const list = allSkins.filter(s => selectedIds.has(s.id));

      if (list.length === 0) {
        canvas.width = 360;
        canvas.height = 150;
        ctx.fillStyle = "#090d16";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#64748b";
        ctx.font = "12px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("Select skins below to generate view", canvas.width / 2, canvas.height / 2);
        return;
      }

      const rows = Math.ceil(list.length / cols);
      canvas.width = (cols * tileSize) + ((cols + 1) * gap);
      canvas.height = headerH + (rows * tileSize) + ((rows + 1) * gap);

      ctx.fillStyle = "#090d16";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (profileImage) {
        ctx.drawImage(profileImage, gap, gap, canvas.width - (gap * 2), 115);
      }

      list.forEach((skin, i) => {
        const c = i % cols;
        const r = Math.floor(i / cols);
        const x = gap + c * (tileSize + gap);
        const y = headerH + gap + r * (tileSize + gap);

        // Load and cache portrait image
        if (!imageCache[skin.id]) {
          const img = new Image();
          img.crossOrigin = "anonymous";
          img.src = skin.imgUrl;
          img.onload = () => {
            imageCache[skin.id] = img;
            redrawCanvas();
          };
          img.onerror = () => {
            const fbImg = new Image();
            fbImg.src = skin.fallbackImg;
            fbImg.onload = () => {
              imageCache[skin.id] = fbImg;
              redrawCanvas();
            };
          };
          imageCache[skin.id] = null;
        }

        const cached = imageCache[skin.id];

        // Background Tile Frame
        ctx.fillStyle = "#141b2d";
        ctx.beginPath();
        ctx.roundRect(x, y, tileSize, tileSize, 10);
        ctx.fill();

        // Draw Portrait Art if Loaded
        if (cached && cached.complete && cached.naturalWidth !== 0) {
          ctx.save();
          ctx.beginPath();
          ctx.roundRect(x, y, tileSize, tileSize, 10);
          ctx.clip();
          ctx.drawImage(cached, x, y, tileSize, tileSize);
          ctx.restore();
        }

        // Tier Border Accent
        ctx.strokeStyle = skin.color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(x, y, tileSize, tileSize, 10);
        ctx.stroke();

        // Points Tag Label at bottom of portrait
        ctx.fillStyle = "rgba(15, 23, 42, 0.88)";
        ctx.beginPath();
        ctx.roundRect(x + 6, y + tileSize - 22, tileSize - 12, 18, 5);
        ctx.fill();
        
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 9px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(`${skin.pts} Pts`, x + (tileSize / 2), y + tileSize - 9);
      });
    }

    // Profile screenshot uploader
    const uploadInput = document.getElementById('user-screenshot-input');
    uploadInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            profileImage = img;
            document.getElementById('screenshot-preview').src = event.target.result;
            document.getElementById('screenshot-preview').classList.remove('hidden');
            document.getElementById('upload-label').classList.add('hidden');
            document.getElementById('delete-screenshot-btn').classList.remove('hidden');
            redrawCanvas();
          };
        };
        reader.readAsDataURL(file);
      }
    });

    function clearScreenshot() {
      profileImage = null;
      uploadInput.value = "";
      document.getElementById('screenshot-preview').classList.add('hidden');
      document.getElementById('upload-label').classList.remove('hidden');
      document.getElementById('delete-screenshot-btn').classList.add('hidden');
      redrawCanvas();
    }

    function executeCanvasDownload() {
      const link = document.createElement('a');
      link.download = `MLBB_Skin_Portraits_${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png', 1.0);
      link.click();
    }

    initDatabase();
  </script>
</body>
</html>
